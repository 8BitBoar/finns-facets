<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finn's Facets &amp; Finds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verd:#2f6b62; --verd-d:#1d4641; --verd-dd:#13302c; --verd-l:#8fbfb3; --verd-wash:#dfece6;
  --brass:#a8823f; --brass-d:#7c5f2a; --brass-l:#d8bf86;
  --gold:#c9a227;
  --pearl:#f4eee0; --pearl-2:#ebe2cd; --card:#fbf8f0;
  --ink:#1d2523; --ink-2:#4a5552; --ink-3:#7b8582;
  --line:#d8ccb0; --line-2:#c5b590;
  --good:#2f7d4f; --bad:#a6402f; --warn:#b07b18;
  --sea:#17383a; --sea-2:#1e4a4b; --sea-glow:#9ff0d8;
  --shadow:0 1px 2px rgba(30,30,20,.08),0 4px 14px rgba(30,30,20,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pearl:#141b1a; --pearl-2:#1b2422; --card:#1f2a28;
    --ink:#ece5d4; --ink-2:#bfb8a6; --ink-3:#8c8778;
    --line:#33413e; --line-2:#465752; --verd-wash:#23332f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --pearl:#141b1a; --pearl-2:#1b2422; --card:#1f2a28;
  --ink:#ece5d4; --ink-2:#bfb8a6; --ink-3:#8c8778;
  --line:#33413e; --line-2:#465752; --verd-wash:#23332f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pearl);color:var(--ink);font:15px/1.45 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600;letter-spacing:.01em}
h2{font-size:1.6rem} h3{font-size:1.25rem} h4{font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
a{color:var(--verd)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* header */
header{background:linear-gradient(180deg,var(--verd-dd),var(--verd-d));color:#f4eee0;border-bottom:3px solid var(--brass)}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 0}
.hdr h1{font-size:1.75rem;line-height:1;color:#f4eee0}
.hdr .sub{font-size:.8rem;color:var(--brass-l);letter-spacing:.12em;text-transform:uppercase}
.seal{width:52px;height:52px;flex:none}
.status{display:flex;flex-wrap:wrap;gap:6px 8px;padding:0 0 12px;align-items:center}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(216,191,134,.35);border-radius:999px;padding:4px 11px;font-size:.88rem;white-space:nowrap}
.pill b{color:var(--brass-l);font-weight:600}
.pill.clock{font-size:1rem;background:rgba(201,162,39,.14);border-color:var(--brass)}
.pill.late{border-color:#e0a35a;color:#ffd9a6}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#888;display:inline-block}
.dot.ok{background:#62d39a}.dot.dirty{background:#e8b04a}.dot.err{background:#e06a55}.dot.off{background:#888}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#cfe3dc;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.93rem}
nav.tabs button.on{background:var(--pearl);color:var(--verd-d)}
nav.tabs button .badge{background:var(--brass);color:#fff;border-radius:999px;font-size:.72rem;padding:0 6px;margin-left:5px}

main{padding:18px 0 60px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.panel h3{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.panel h3 .meta{margin-left:auto;font-family:"Source Sans 3";font-size:.85rem;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
hr.rule{border:0;border-top:1px dashed var(--line-2);margin:10px 0}

.btn{background:var(--verd);color:#fff;border:1px solid var(--verd-d);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.brass{background:var(--brass);border-color:var(--brass-d)}
.btn.ghost{background:transparent;color:var(--verd);border-color:var(--line-2)}
.btn.danger{background:var(--bad);border-color:#7c2e21}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.end{background:var(--gold);border-color:var(--brass-d);color:#231a05}
select,input[type=text],input[type=number],input[type=password]{background:var(--pearl);border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;max-width:100%}
input[type=number]{width:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--ink-2)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.tscroll{overflow-x:auto}

.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.76rem;font-weight:600;border:1px solid var(--line-2);background:var(--pearl-2)}
.tag.q-Crude{background:#e6e0d2;color:#5a5446;border-color:#cfc6b1}
.tag.q-Fine{background:#d9ebe4;color:#1f5a4d;border-color:#a8cfc2}
.tag.q-Perfect{background:#f6e6b0;color:#6b5108;border-color:#d8bd62}
.tag.r-Common{color:#5f6461}.tag.r-Uncommon{color:#2f7d4f}.tag.r-Rare{color:#2b5fa0}.tag.r-Mythic{color:#a0402b}
.tag.urgent{background:#f6d7cf;color:#8c2f1e;border-color:#e2a593}
.tag.ok{background:#d6ecdc;color:#1f6138;border-color:#9fcfae}
.tag.no{background:#f3dcd6;color:#8c2f1e;border-color:#e2b0a2}
.tag.warn{background:#f6e8c8;color:#7a5410;border-color:#e0c486}
.gemdot{width:12px;height:12px;border-radius:50%;display:inline-block;vertical-align:-1px;border:1px solid rgba(0,0,0,.25);box-shadow:inset -2px -2px 3px rgba(0,0,0,.2),inset 2px 2px 3px rgba(255,255,255,.5)}
.shape{width:18px;height:18px;vertical-align:-4px;flex:none}

/* sea map */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--brass);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node .ring{fill:rgba(159,240,216,.12);stroke:var(--sea-glow);stroke-width:2.5}
.node .halo{fill:none;stroke:var(--sea-glow);stroke-opacity:.5;animation:pulse 2.6s ease-out infinite}
.node.sel .ring{stroke:var(--gold);fill:rgba(201,162,39,.2)}
.node text{font:600 13px "Source Sans 3";fill:#e9fff7;text-anchor:middle;pointer-events:none}
.node text.c{fill:#ffe9a8}
@media (max-width:600px){.node text{font-size:24px}.node .ring{stroke-width:4}}
@keyframes pulse{0%{r:20;stroke-opacity:.7}100%{r:40;stroke-opacity:0}}
@media (prefers-reduced-motion:reduce){.node .halo{animation:none}}

/* work orders */
.wo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.wo-h{padding:10px 14px;background:linear-gradient(180deg,var(--verd-wash),transparent);border-bottom:1px dashed var(--line-2)}
.wo-h .fac{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-d);font-weight:700}
.wo-h h4{font-size:1.15rem;margin:2px 0}
.wo-b{padding:8px 14px;flex:1}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:7px 0;background:var(--pearl)}
.slot.pass{border-color:#9fcfae;background:color-mix(in srgb,var(--pearl) 85%,#2f7d4f)}
.slot .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.slot .req{font-weight:600}
.wo-f{padding:9px 14px;border-top:1px solid var(--line);background:var(--pearl-2)}
.price{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:700;color:var(--verd-d)}
:root[data-theme="dark"] .price{color:var(--verd-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .price{color:var(--verd-l)}}
.stages{display:flex;gap:4px;margin:6px 0}
.stages span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stages span.on{background:var(--brass)}

.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--verd),var(--verd-l))}
.bar.brass i{background:linear-gradient(90deg,var(--brass-d),var(--brass-l))}

.log{max-height:430px;overflow:auto;font-size:.88rem}
.log div{padding:4px 0;border-bottom:1px dotted var(--line)}
.log .t{color:var(--ink-3);font-size:.78rem;margin-right:6px}
td.cr-plus,td.cr-minus,.nowrap{white-space:nowrap}
.cr-plus{color:var(--good);font-weight:600}.cr-minus{color:var(--bad);font-weight:600}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--verd-dd);color:#f4eee0;border:1px solid var(--brass);padding:9px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:50;max-width:min(92vw,560px);font-size:.92rem;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:#f6e8c8;color:#5e420d;border:1px solid #e0c486;border-radius:8px;padding:9px 12px;margin-bottom:14px}
.empty{color:var(--ink-3);font-style:italic;padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.9rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.statbox{text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--pearl)}
.statbox .n{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:700;line-height:1}
.sockets{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sock{border:1px dashed var(--line-2);border-radius:8px;padding:6px 8px;min-width:150px;flex:1;background:var(--pearl)}
.sock.filled{border-style:solid;border-color:#9fcfae}
details summary{cursor:pointer;font-weight:600}
.sr{position:absolute;left:-9999px}
</style>
</head>

<main><div class="wrap" id="view"></div></main>

const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function wpick(entries){
  if(!Array.isArray(entries))entries=Object.entries(entries);
  entries=entries.filter(([,w])=>w>0);
  if(!entries.length)return null;
  let t=entries.reduce((s,[,w])=>s+w,0),r=Math.random()*t;
  for(const [v,w] of entries){r-=w;if(r<0)return v}
  return entries[entries.length-1][0];
}

function migrate(s){
  s.config=Object.assign(deep(DEFAULT_CONFIG),s.config||{});
  s.config.gemPrices=Object.assign({...DEFAULT_GEM_PRICES},s.config.gemPrices||{});
  s.config.perks=Object.assign(deep(DEFAULT_CONFIG.perks),s.config.perks||{});
  for(const f of FACTIONS) if(!s.factions[f.key]) s.factions[f.key]={rp:0,level:0,registered:false,autoRenew:false};
  for(const k of ["nodes","hold","storage","gems","parts","relics","offers","orders","done","log","ledger"]) s[k]=s[k]||[];
  s.meta=s.meta||{savedAt:Date.now()};
  if(!s.version||s.version<2||s.clock.day<20000){ // old "Day N" saves -> calendar days ending today
    const off=todayDN()-s.clock.day;
    const sh=o=>{for(const k of ["expires","created","accepted","deadline","day"])if(typeof o[k]==="number")o[k]+=off};
    s.clock.day+=off;[...s.offers,...s.orders,...s.done,...s.relics].forEach(sh);
    s.version=2;
  }
  if(s.wallet==null)s.wallet=0;
  if(!s.partner){const keep=S;S=s;s.partner=newPartner();S=keep}
  if(!s.lifetime){
    s.lifetime={cut:{},found:{},sold:{},best:{},earned:{}};
    const L=s.lifetime,idByName=n=>(DB.relics.find(r=>r.name===n)||{}).id||n;
    for(const it of [...s.hold,...s.storage])if(it.kind==="relic")noteFound(L,it.relicId,it.condition);
    for(const x of s.relics){const id=idByName(x.name);noteFound(L,id,x.condition);L.sold[id]=(L.sold[id]||0)+1;L.earned[id]=r2((L.earned[id]||0)+x.total)}
    for(const g of s.gems)if(g.state==="spell")L.cut[g.spell.name]=(L.cut[g.spell.name]||0)+1;
  }
  return s;
}

/* ---------- PARTNERSHIP (Emma Frost, silent partner) ---------- */
function newPartner(){return {invested:883000,cap:1059600,share:20,draw:300,paid:0,active:true,endedHow:null,
  startDay:S.clock.day,cur:{month:monthOf(S.clock.day),income:0,costs:0},history:[]}}
const P_=()=>S.partner;
const owedLeft=()=>Math.max(0,r2(P_().cap-P_().paid));
function closeMonth(label){ // runs on the 1st, for the month that just ended
  const p=P_(),m=p.cur,notes=[];
  let draw=Math.min(p.draw,Math.max(0,S.credits));
  if(draw>0){money(-draw,`Owner's draw — ${label}`,"none");S.wallet=r2(S.wallet+draw);walletLog(draw,`Owner's draw — ${label}`)}
  if(draw<p.draw)notes.push(`The business could only cover ${cr(draw)} of the ${cr(p.draw)} owner's draw.`);
  const profit=r2(m.income-m.costs-p.draw);
  let emma=0;
  if(p.active&&profit>0){emma=r2(Math.min(profit*p.share/100,owedLeft()));
    money(-emma,`Emma Frost — ${p.share}% profit distribution, ${label}`,"none");p.paid=r2(p.paid+emma)}
  p.history.unshift({month:label,income:r2(m.income),costs:r2(m.costs),draw,profit,emma,paidToDate:p.paid});
  notes.push(p.active?(profit>0?`${label} closed: ${cr(profit)} distributable profit, ${cr(emma)} to Emma.`:`${label} closed with no distributable profit — nothing owed to Emma.`):`${label} closed: ${cr(profit)} distributable profit.`);
  if(p.active&&p.paid>=p.cap-0.005){p.active=false;p.endedHow="cap";notes.push("Emma's distributions reached the cap — the partnership is over. Finn owns Finn's Facets & Finds outright!");toast("Finn owns everything outright!")}
  p.cur={month:monthOf(S.clock.day),income:0,costs:0};
  return notes;
}
function buyout(){
  const p=P_(),price=owedLeft();if(!p.active)return;
  if(!canPay(price)){toast(`The buyout is ${cr(price)} — the business has ${cr(S.credits)}.`);return}
  if(!confirm(`Buy Emma out for ${cr(price)}? (${cr(p.cap)} less the ${cr(p.paid)} already distributed.) Finn will own everything outright.`))return;
  money(-price,"Buyout — Emma Frost's share",'none');p.paid=r2(p.paid+price);p.active=false;p.endedHow="buyout";
  addLog(`Finn bought Emma out for ${cr(price)}. Finn's Facets & Finds is all hers.`);toast("Bought out! Finn owns everything outright.");commit();
}
function walletLog(amt,text){S.wledger=S.wledger||[];S.wledger.unshift({at:stamp(),text,amt:r2(amt),bal:S.wallet});if(S.wledger.length>400)S.wledger.length=400}

function relinkLifetime(){ // history saved before the relic DB loaded is keyed by name; move it to the relic's id
  if(!S||!S.lifetime||!DB.relics.length)return;const L=S.lifetime;
  for(const r of DB.relics)for(const k of ["found","sold","earned","best"]){const m=L[k];if(m[r.name]!=null&&r.name!==r.id){
    if(k==="best"){if(!m[r.id]||COND_RANK.indexOf(m[r.name])>COND_RANK.indexOf(m[r.id]))m[r.id]=m[r.name]}else m[r.id]=r2((m[r.id]||0)+m[r.name]);
    delete m[r.name]}}
}

function stamp(){return `${fmtShort(S.clock.day)} ${fmtTime(S.clock.min)}`}
function addLog(text){S.log.unshift({at:stamp(),text});if(S.log.length>400)S.log.length=400}
function money(amount,text,cat){S.credits=r2(S.credits+amount);
  if(S.partner&&cat!=="none"){if(amount>=0)S.partner.cur.income=r2(S.partner.cur.income+amount);else S.partner.cur.costs=r2(S.partner.cur.costs-amount)}
  S.ledger.unshift({at:stamp(),text,amt:r2(amount),bal:S.credits});if(S.ledger.length>600)S.ledger.length=600}
function canPay(a){return S.credits+1e-9>=a}
function pay(a,text){if(!canPay(a)){toast(`Not enough Credits (need ${cr(a)})`);return false}money(-a,text);return true}
function spendTime(base){const m=isLate()?Math.ceil(base*1.25):base;S.clock.min+=m;return m}
function gainXP(n,why){
  if(!n)return;S.xp+=n;
  let msg=`+${n} XP (${why})`;
  while(S.xp>=xpToReach(S.level+1)){S.xp-=xpToReach(S.level+1);S.level++;S.statPoints++;msg+=` — Level ${S.level}! +1 stat point`;}
  addLog(msg);
}

/* run a timed action, then save + render */
function act(baseMin,fn,label){
  const ok=fn();
  if(ok===false)return;
  const m=baseMin?spendTime(baseMin):0;
  if(label)addLog(label+(m?` (${fmtDur(m)})`:""));
  commit();
}

function genNode(){
  const tagNames=Object.keys(TAGS);
  const n2=Math.random()<.4?2:1;
  const tags=shuffle(tagNames).slice(0,n2);
  let x,y,tries=0;
  do{x=rint(290,760);y=rint(45,455);tries++}
  while(tries<60&&S.nodes.some(o=>Math.hypot(o.x-x,o.y-y)<95));
  const attempts=rint(3,6)+(tags.includes("Rich")?2:0)+prank("better_rig");
  return {id:nid("n"),x,y,tags,attempts,left:attempts,revealOrder:shuffle(tags)};
}
function fillNodes(){while(S.nodes.length<nodesVisible())S.nodes.push(genNode())}
function revealed(n){return n.revealOrder.slice(0,prank("sonar_sweep"))}

function sail(id){
  const n=nodeById(id);if(!n)return;
  if(S.location===id)return;
  const c=tripCost(n);
  act(tripTime(n),()=>{if(!pay(c,`Metered Mana — trawler trip`))return false;S.location=id;S.pos=null;},`Sailed to a Dredge Node (${cr(c)})`);
}
function returnHome(){
  if(atHome())return;
  act(30,()=>{S.location="home";S.pos=null;unload();},"Returned home and unloaded");
}
function unload(){
  const free=storageCap()-used(S.storage);let moved=0,left=[];
  let room=free;
  for(const it of S.hold){if(itemSpace(it)<=room){S.storage.push(it);room-=itemSpace(it);moved++}else left.push(it)}
  S.hold=left;
  if(left.length)addLog(`Home storage is full — ${left.length} item(s) stay in the trawler hold.`);
}
function rollDredge(n){
  const T=n.tags,c=cfg();
  const relicChance=c.relicBase+(T.includes("Wreck")?c.relicWreck:0)+(T.includes("Ruins")?c.relicRuins:0);
  if(DB.relics.length&&Math.random()*100<relicChance){
    const size=wpick(T.includes("Ruins")?{Small:25,Medium:35,Large:25,Monumental:15}:{Small:50,Medium:30,Large:15,Monumental:5});
    let pool=DB.relics.filter(r=>r.size===size);if(!pool.length)pool=DB.relics;
    const R=pick(pool);
    const shifts=(T.includes("Wreck")?1:0)+(T.includes("Ruins")?1:0),sh=c.condShift;
    const cond=wpick({Damaged:50-sh*shifts,"Slightly Worn":35+sh/2*shifts,Pristine:15+sh/2*shifts});
    return {id:nid("r"),kind:"relic",relicId:R.id,name:R.name,size:R.size,base:R.base,description:R.description,condition:cond,
            sockets:R.sockets.map(s=>({school:s.school,level:s.level,gem:null})),stage:"dormant"};
  }
  let w={Pebble:40,Fist:35,Melon:18,Boulder:7};
  if(T.includes("Shallows"))w={Pebble:55,Fist:35,Melon:8,Boulder:2};
  if(T.includes("Trench"))w={Pebble:12,Fist:28,Melon:35,Boulder:25};
  return {id:nid("g"),kind:"geode",size:wpick(w),tags:T.slice()};
}
function dredge(){
  const n=nodeById(S.location);if(!n||n.left<=0)return;
  act(20,()=>{
    n.left--;gainXP(1,"dredge attempt");
    const it=rollDredge(n);
    const what=it.kind==="relic"?`a ${it.size} relic — ${it.name} (${it.condition})`:`a ${it.size} geode`;
    if(it.kind==="relic"){gainXP(5,"found a relic");noteFound(S.lifetime,it.relicId,it.condition)}
    if(used(S.hold)+itemSpace(it)>holdCap()){addLog(`Hauled up ${what}, but it won't fit in the hold. Back it goes.`);toast(`Hold full — ${what} went back over the side.`)}
    else{S.hold.push(it);addLog(`Hauled up ${what}.`);toast(`Hauled up ${what}!`)}
    if(n.left===0){S.nodes=S.nodes.filter(x=>x!==n);S.location="sea";S.pos={x:n.x,y:n.y};UI.selNode=null;addLog("The Dredge Node fades. A new one will appear tomorrow.")}
  },"Dredge attempt");
}
function toss(where,id){
  const list=where==="hold"?S.hold:S.storage;const i=list.findIndex(x=>x.id===id);if(i<0)return;
  if(list[i].kind==="relic"&&list[i].sockets.some(s=>s.gem)){toast("Unsocket its gems first.");return}
  if(!confirm("Toss this back into the sea? It's gone for good."))return;
  list.splice(i,1);addLog("Tossed an item back into the sea.");commit();
}

/* ================================================================
   CHISEL & CUT
   ================================================================ */
function rollGem(tags){
  let rw={...RARITY_ODDS};
  if(tags.includes("Deep"))rw={Common:35,Uncommon:30,Rare:23,"Mythic Rare":12};
  if(tags.includes("Shallows"))rw={Common:65,Uncommon:25,Rare:8,"Mythic Rare":2};
  const rar=wpick(rw);
  const pool=Object.keys(GEMS).filter(g=>GEMS[g].r===rar);
  const tw=pool.map(g=>{let w=1;
    if(tags.includes("Reef")&&["Aquamarine","Moonstone","Opal"].includes(g))w*=3;
    if(tags.includes("Vent")&&["Ruby","Garnet","Topaz"].includes(g))w*=3;
    return [g,w]});
  return {id:nid("gem"),type:wpick(tw),quality:wpick(Object.fromEntries(QUALITIES.map(q=>[q,QUALITY[q].odds]))),state:"rough"};
}
function chisel(id){
  if(!atHome()){toast("The cracking bench is at home.");return}
  const i=S.storage.findIndex(x=>x.id===id&&x.kind==="geode");if(i<0)return;
  const g=S.storage[i];
  act(GEODES[g.size].chisel,()=>{
    S.storage.splice(i,1);
    const n=rint(1,GEODES[g.size].max),got=[];
    for(let k=0;k<n;k++){const gem=rollGem(g.tags||[]);S.gems.push(gem);got.push(`${gem.quality} ${gem.type}`)}
    toast(`Inside: ${got.join(", ")}`);addLog(`Chiseled a ${g.size} geode: ${got.join(", ")}.`);
  },"Chiseled a geode");
}
function canCutSpell(sp){return sp.level<=maxSpellLevel()&&S.patterns[sp.school]}
function cutPlain(gemId,cut,quiet){
  const g=S.gems.find(x=>x.id===gemId);if(!g||g.state!=="rough")return false;
  if(!atHome()){toast("The faceting wheel is at home.");return false}
  g.state="plain";g.cut=cut;spendTime(60);gainXP(2,"plain cut");
  addLog(`Cut a ${g.quality} ${g.type} — ${cut} (plain).`);
  if(!quiet)commit();return true;
}
function cutSpell(gemId,spellName,quiet){
  const g=S.gems.find(x=>x.id===gemId);if(!g||g.state!=="rough")return false;
  if(!atHome()){toast("The faceting wheel is at home.");return false}
  const sp=DB.spells.find(s=>s.name===spellName);if(!sp)return false;
  if(!GEMS[g.type].s.includes(sp.school)){toast(`${g.type} has no ${sp.school} affinity.`);return false}
  if(!canCutSpell(sp)){toast(`Finn can't cut that yet — max spell level ${maxSpellLevel()}, and the ${sp.school} pattern must be learned.`);return false}
  const mana=r2(spellCost(sp.level)*.2);
  if(!pay(mana,`Metered Mana — ${sp.name} cut`))return false;
  g.state="spell";g.spell={name:sp.name,level:sp.level,school:sp.school};S.lifetime.cut[sp.name]=(S.lifetime.cut[sp.name]||0)+1;
  const m=spendTime(60+30*sp.level);gainXP(3+sp.level,"spell cut");
  addLog(`Spell-cut a ${g.quality} ${g.type} for ${sp.name} — ${SCHOOL_SHAPE[sp.school]}, ${sp.level?facets(sp.level)+" facets":"cabochon"} (${fmtDur(m)}).`);
  if(!quiet)commit();return true;
}

const mountName=(base,slots,metal)=>base==="Earrings"?`${metal} earrings`:`${metal} ${BASES[base].styles[slots]} ${BASE_LABEL[base].toLowerCase()}`;
const mountingPrice=(base,slots,metal)=>(BASES[base].price+(base==="Earrings"?0:5*Math.max(0,slots-1)))*METALS[metal];
function orderMounting(base,slots,metal,quiet){

/* ================================================================
   COMMISSIONS
   ================================================================ */
function pickSpell(f){
  if(!DB.spells.length)return null;
  const [lo,hi]=f.levels;
  const pool=DB.spells.filter(s=>s.level>=lo&&s.level<=hi);
  if(!pool.length)return null;
  return wpick(pool.map(s=>[s,(f.schools[s.school]||1)*(hi-s.level+1)]));
}
function pickAffinityGem(school,f){
  return wpick(Object.keys(GEMS).filter(g=>GEMS[g].s.includes(school)).map(g=>[g,f.rarity[GEMS[g].r]||1]));
}
function pickPlainGem(f){return wpick(Object.keys(GEMS).map(g=>[g,f.rarity[GEMS[g].r]||1]))}
function pickPlainCut(t){if(["Opal","Moonstone"].includes(t)&&Math.random()<.5)return "Cabochon";return pick(PLAIN_CUTS)}
const pickQ=f=>wpick(f.quality);
function cheapestAffinity(school){return Object.keys(GEMS).filter(g=>GEMS[g].s.includes(school)).sort((a,b)=>gemPrice(a)-gemPrice(b))[0]}

function pickClient(f){
  const d=DB.factions&&DB.factions[f.key];
  if(!d)return {who:pick(f.who),planes:[]};
  const orgs=d.organizations||[],people=d.people||[];
  const c=wpick([...orgs.map(o=>[{o},2]),...people.map(p=>[{p},1])]);
  if(!c)return {who:pick(f.who),planes:[]};
  if(c.o)return {who:c.o.name,planes:c.o.planes||[]};
  const org=c.p.org&&orgs.find(o=>o.id===c.p.org);
  return {who:c.p.name+(c.p.title?`, ${c.p.title}`:"")+(org?` of ${org.name}`:""),planes:(c.p.planes&&c.p.planes.length)?c.p.planes:(org?org.planes:[])};
}
function genOrder(f){
  const types={...f.types};
  if(!DB.spells.length){types.spell=0;types.reattune=0}
  const type=wpick(types)||"plain";
  const cl=pickClient(f);
  const o={id:nid("wo"),faction:f.key,who:cl.who,planes:cl.planes,type,urgent:Math.random()*100<cfg().urgentChance,
           expires:S.clock.day+rint(3,7),created:S.clock.day,slots:[],stage:"offer"};
  const spellShare=types.spell/((types.spell+types.plain)||1);
  if(type==="plain"){
    const t=pickPlainGem(f);
    const isRough=Math.random()<f.rough;
    const cut=isRough?"rough":pickPlainCut(t);
    o.slots.push({kind:"gem",label:"Gem",req:{gemType:t,minQ:pickQ(f),cut,spell:null}});
    o.title=isRough?`Rough ${t}`:`${cut}-cut ${t}`;
  }else if(type==="spell"){
    const sp=pickSpell(f),t=pickAffinityGem(sp.school,f);
    o.slots.push({kind:"gem",label:"Spell gem",req:{gemType:t,minQ:pickQ(f),cut:null,spell:{name:sp.name,level:sp.level,school:sp.school}}});
    o.title=`${t} cut for ${sp.name}`;
  }else if(type==="piece"){
    const base=wpick(f.bases),B=BASES[base];
    const n=rint(B.min,B.max),metal=wpick(f.metals);
    const mkGem=()=>{
      if(DB.spells.length&&Math.random()<spellShare){const sp=pickSpell(f);return {gemType:pickAffinityGem(sp.school,f),minQ:pickQ(f),cut:null,spell:{name:sp.name,level:sp.level,school:sp.school}}}
      const t=pickPlainGem(f);return {gemType:t,minQ:pickQ(f),cut:pickPlainCut(t),spell:null};
    };
    if(base==="Earrings"){const r=mkGem();o.slots.push({kind:"gem",label:"Left ear",req:r},{kind:"gem",label:"Right ear",req:deep(r)})}
    else for(let i=0;i<n;i++)o.slots.push({kind:"gem",label:`Gem slot ${i+1}`,req:mkGem()});
    o.slots.push({kind:"mounting",label:"Mounting",req:{base,slots:n,metal}});
    const k=rint(f.orn[0],f.orn[1]);
    for(const name of shuffle([...Object.keys(ORNAMENTS),"Accent stones"]).slice(0,k)){
      if(name==="Accent stones")o.slots.push({kind:"accent",label:"Accent stones",req:{count:rint(2,6)},fill:[]});
      else o.slots.push({kind:"ornament",label:"Ornamentation",req:{name}});
    }
    const spells=o.slots.filter(s=>s.kind==="gem"&&s.req.spell).length;
    o.title=`${metal} ${base==="Earrings"?"earrings":B.styles[n]+" "+BASE_LABEL[base].toLowerCase()}${spells?` with ${spells} spell gem${spells>1?"s":""}`:""}`;
    o.piece={base,slots:n,metal};
  }else{ // reattune
    const sp=pickSpell(f),base=wpick(f.bases);
    const cracked=Math.random()*100<cfg().crackChance;
    o.reattune={piece:BASE_LABEL[base],spell:{name:sp.name,level:sp.level,school:sp.school},cracked};
    if(cracked)o.slots.push({kind:"replace",label:"Replacement gem (cracked)",req:{spell:o.reattune.spell,gemType:cheapestAffinity(sp.school),minQ:"Crude"}});
    else o.slots.push({kind:"bath",label:"Manasonic Bath",req:{spell:o.reattune.spell},bath:"waiting"});
    o.title=`Re-attune a ${BASE_LABEL[base].toLowerCase()} — ${sp.name}`;
  }
  const spellGems=o.slots.filter(s=>(s.kind==="gem"&&s.req.spell)).length;
  o.urgentDays=rint(2,5)+(type==="piece"?Math.max(0,spellGems-1):0);
  o.quote=priceOf(o,false).total;
  return o;
}

function fillOf(s){
  if(s.kind==="accent")return (s.fill||[]).map(id=>S.gems.find(g=>g.id===id)).filter(Boolean);
  if(!s.fill)return null;
  if(s.kind==="mounting"||s.kind==="ornament")return S.parts.find(p=>p.id===s.fill)||null;
  return S.gems.find(g=>g.id===s.fill)||null;
}
/* Price = gem base × Quality + spell cost + parts + fee(25% of parts); urgent +50% */
function priceOf(o,live){
  let gems=0,spells=0,parts=0;const lines=[];
  for(const s of o.slots){
    const f=live&&o.frozen?o.frozen[o.slots.indexOf(s)]:(live?fillOf(s):null);
    if(s.kind==="gem"){
      const t=s.req.gemType,q=(f&&f.quality)||s.req.minQ;
      let v=gemValue(t,q);
      if(s.req.cut==="rough"){v*=.75;lines.push([`${q} ${t} (rough ×0.75)`,v])}
      else lines.push([`${q} ${t}`,v]);
      gems+=v;
      if(s.req.spell){const c=spellCost(s.req.spell.level);spells+=c;lines.push([`${s.req.spell.name} cut`,c])}
    }else if(s.kind==="replace"){
      const t=(f&&f.type)||s.req.gemType,q=(f&&f.quality)||s.req.minQ,v=gemValue(t,q);gems+=v;lines.push([`Replacement ${q} ${t}`,v]);
    }else if(s.kind==="mounting"){const p=mountingPrice(s.req.base,s.req.slots,s.req.metal);parts+=p;lines.push(["Mounting",p])}
    else if(s.kind==="ornament"){const p=ORNAMENTS[s.req.name];parts+=p;lines.push([s.req.name,p])}
    else if(s.kind==="accent"){const p=ACCENT_PRICE*s.req.count;parts+=p;lines.push([`Accent setting ×${s.req.count}`,p])}
  }
  if(o.type==="reattune"){const c=spellCost(o.reattune.spell.level)/2;spells+=c;lines.push(["Re-attunement (½ spell)",c])}
  const fee=parts*cfg().fee/100;
  let total=gems+spells+parts+fee;
  const urgentFee=(o.urgent&&!o.missed)?total*cfg().urgentPct/100:0;
  total+=urgentFee;
  const referral=total*cfg().referral/100;
  return {gems,spells,parts,fee,urgentFee,total:r2(total),referral:r2(referral),net:r2(total-referral),lines};
}
function rpOf(o){
  if(o.urgent&&o.missed)return 0;
  const bonus=l=>Math.ceil(l/3);
  if(o.type==="plain"||o.type==="reattune")return 1;
  if(o.type==="spell")return 2+bonus(o.slots[0].req.spell.level);
  return 3+o.slots.filter(s=>s.kind==="gem"&&s.req.spell).reduce((a,s)=>a+bonus(s.req.spell.level),0);
}
function slotPasses(s){
  if(s.kind==="accent")return (s.fill||[]).length>=s.req.count;
  if(s.kind==="bath")return s.bath==="done";
  return !!fillOf(s);
}
function candidates(o,s){
  if(s.kind==="gem"){const r=s.req;return S.gems.filter(g=>!g.reserved&&g.type===r.gemType&&qRank(g.quality)>=qRank(r.minQ)&&(
      r.cut==="rough"?g.state==="rough":r.spell?(g.state==="spell"&&g.spell.name===r.spell.name):(g.state==="plain"&&g.cut===r.cut)))}
  if(s.kind==="replace")return S.gems.filter(g=>!g.reserved&&g.state==="spell"&&g.spell.name===s.req.spell.name);
  if(s.kind==="accent")return S.gems.filter(g=>!g.reserved&&g.state==="plain");
  if(s.kind==="mounting")return S.parts.filter(p=>!p.reserved&&p.kind==="mounting"&&p.base===s.req.base&&p.slots===s.req.slots&&p.metal===s.req.metal);
  if(s.kind==="ornament")return S.parts.filter(p=>!p.reserved&&p.kind==="ornament"&&p.name===s.req.name);
  return [];
}
/* rough gems that could be cut to satisfy a slot */
function roughFor(s){
  if(s.kind==="gem"&&s.req.cut!=="rough")return S.gems.filter(g=>!g.reserved&&g.state==="rough"&&g.type===s.req.gemType&&qRank(g.quality)>=qRank(s.req.minQ));
  if(s.kind==="replace")return S.gems.filter(g=>!g.reserved&&g.state==="rough"&&GEMS[g.type].s.includes(s.req.spell.school));
  if(s.kind==="accent")return S.gems.filter(g=>!g.reserved&&g.state==="rough");
  return [];
}
const findOrder=id=>S.orders.find(o=>o.id===id);
function fillSlot(oid,idx,itemId){
  const o=findOrder(oid),s=o.slots[idx];if(!o||o.stage!=="filling")return;
  const pool=(s.kind==="mounting"||s.kind==="ornament")?S.parts:S.gems;
  if(s.kind==="accent"){
    const g=S.gems.find(x=>x.id===itemId);if(!g)return;g.reserved=o.id;s.fill.push(g.id);
  }else{
    if(s.fill){const old=pool.find(x=>x.id===s.fill);if(old)delete old.reserved}
    s.fill=null;
    if(itemId){const it=pool.find(x=>x.id===itemId);if(it){it.reserved=o.id;s.fill=it.id}}
  }
  commit();
}
function unfillAccent(oid,idx,gid){
  const o=findOrder(oid),s=o.slots[idx];s.fill=s.fill.filter(x=>x!==gid);const g=S.gems.find(x=>x.id===gid);if(g)delete g.reserved;commit();
}
function autoFill(oid){
  const o=findOrder(oid);let n=0;
  o.slots.forEach((s,i)=>{
    if(s.kind==="accent"){while(s.fill.length<s.req.count){const c=candidates(o,s).sort((a,b)=>gemPrice(a.type)-gemPrice(b.type)||qRank(a.quality)-qRank(b.quality))[0];if(!c)break;c.reserved=o.id;s.fill.push(c.id);n++}return}
    if(s.kind==="bath"||s.fill)return;
    const c=candidates(o,s).sort((a,b)=>qRank(a.quality||"Crude")-qRank(b.quality||"Crude"))[0];
    if(c){c.reserved=o.id;s.fill=c.id;n++}
  });
  toast(n?`Filled ${n} slot${n>1?"s":""} from inventory.`:"Nothing in inventory matches the open slots.");commit();
}
/* cut a qualifying rough stone straight into this slot */
function cutFor(oid,idx){
  const o=findOrder(oid),s=o.slots[idx];
  const pool=roughFor(s).sort((a,b)=>qRank(a.quality)-qRank(b.quality)||gemPrice(a.type)-gemPrice(b.type));
  const g=pool[0];if(!g){toast("No rough stone qualifies.");return}
  let ok;
  if(s.kind==="accent")ok=cutPlain(g.id,"Round Brilliant",true);
  else if(s.req.spell)ok=cutSpell(g.id,s.req.spell.name,true);
  else ok=cutPlain(g.id,s.req.cut,true);
  if(!ok){render();return}
  g.reserved=o.id;
  if(s.kind==="accent")s.fill.push(g.id);else s.fill=g.id;
  commit();
}
function buyPartsFor(oid){
  const o=findOrder(oid);let n=0;
  for(const s of o.slots){
    if(s.kind==="mounting"&&!s.fill){
      let p=candidates(o,s)[0];
      if(!p){if(!orderMounting(s.req.base,s.req.slots,s.req.metal,true))break;p=S.parts[S.parts.length-1]}
      p.reserved=o.id;s.fill=p.id;n++;
    }
    if(s.kind==="ornament"&&!s.fill){
      let p=candidates(o,s)[0];
      if(!p){if(!orderOrnament(s.req.name,true))break;p=S.parts[S.parts.length-1]}
      p.reserved=o.id;s.fill=p.id;n++;
    }
  }
  if(n)toast(`Parts in hand for ${n} slot${n>1?"s":""}.`);commit();
}
function accept(oid){
  const i=S.offers.findIndex(o=>o.id===oid);if(i<0)return;
  if(S.orders.length>=commissionCap()){toast(`Commission cap reached (${commissionCap()} active).`);return}
  const o=S.offers.splice(i,1)[0];
  o.stage="filling";o.accepted=S.clock.day;
  if(o.urgent)o.deadline=S.clock.day+o.urgentDays;
  S.orders.push(o);addLog(`Accepted: ${o.title} — ${FAC[o.faction].name} on behalf of ${o.who}.`);commit();
}
function decline(oid){S.offers=S.offers.filter(o=>o.id!==oid);addLog("Let a commission offer go.");commit()}
function release(o){
  for(const s of o.slots){
    const ids=s.kind==="accent"?(s.fill||[]):[s.fill];
    for(const id of ids){const it=[...S.gems,...S.parts].find(x=>x.id===id);if(it)delete it.reserved}
  }
}
function abandon(oid){
  const o=findOrder(oid);if(!o)return;
  if(o.stage!=="filling"){toast("It's already assembled.");return}
  if(!confirm("Cancel this commission? Reserved gems and parts go back to inventory. No pay, no RP."))return;
  release(o);S.orders=S.orders.filter(x=>x!==o);addLog(`Cancelled: ${o.title}.`);commit();
}
function startBath(oid,idx){
  const o=findOrder(oid),s=o.slots[idx];if(!atHome()){toast("The Manasonic Bath is at home.");return}
  const sp=s.req.spell;if(!canCutSpell(sp)){toast("Finn needs that spell level and pattern to re-facet it.");return}
  const mana=r2(spellCost(sp.level)/2*.2);
  act(30,()=>{if(!pay(mana,`Metered Mana — Manasonic Bath (${sp.name})`))return false;s.bath="soaking";},`Unset the gem and started a Manasonic Bath soak — finishes overnight`);
}
function refacet(oid,idx){
  const o=findOrder(oid),s=o.slots[idx];if(!atHome())return;
  act(60+30*s.req.spell.level,()=>{s.bath="done";gainXP(2,"re-attunement");},`Re-faceted ${s.req.spell.name} into the fresh growth (a little hazy, as re-attuned gems are)`);
}
function assemble(oid){
  const o=findOrder(oid);if(!o||!o.slots.every(slotPasses))return;
  if(!atHome()){toast("Assembly happens in the workroom.");return}
  const gemsN=o.slots.filter(s=>s.kind==="gem").length;
  const t=o.type==="piece"?60+15*gemsN:o.type==="reattune"?15:0;
  const accent=o.slots.filter(s=>s.kind==="accent").reduce((a,s)=>a+s.req.count*ACCENT_PRICE,0);
  act(t,()=>{
    if(accent&&!pay(accent,"Hallmark's — accent stone setting"))return false;
    o.frozen=o.slots.map(s=>{const f=fillOf(s);return f?deep(f):null});
    for(const s of o.slots){
      const ids=s.kind==="accent"?s.fill:[s.fill];
      for(const id of ids){S.gems=S.gems.filter(g=>g.id!==id);S.parts=S.parts.filter(p=>p.id!==id)}
    }
    o.stage="assembled";
  },o.type==="piece"?`Set the gems into the ${o.title}`:o.type==="reattune"?"Reset the gem in its piece":"Readied the gem for packing");
}
function packOrder(oid){
  const o=findOrder(oid);if(!o||o.stage!=="assembled"||!atHome())return;
  act(15,()=>{if(!pay(PACK_COST,"Jewelry case"))return false;o.stage="packed"},"Packed the order: velvet case, business card, parcel paper, twine, wax and hanko");
}
function sendOrder(oid){
  const o=findOrder(oid);if(!o||o.stage!=="packed"||!atHome())return;
  act(5,()=>{
    const p=priceOf(o,true),rp=rpOf(o),fac=S.factions[o.faction];
    money(p.total,`${o.title} — ${o.who}`);
    money(-p.referral,`${FAC[o.faction].name} referral cut (${cfg().referral}%)`);
    addRP(o.faction,rp);
    gainXP(5*rp,"completed commission");
    S.orders=S.orders.filter(x=>x!==o);
    S.done.unshift({id:o.id,title:o.title,who:o.who,faction:o.faction,day:S.clock.day,total:p.total,net:p.net,rp,urgent:o.urgent,missed:!!o.missed});
    if(S.done.length>200)S.done.length=200;
    toast(`Delivered! ${cr(p.net)} after referral, +${rp} RP.`);
  },"Sent the parcel through the sending circle");
}
function addRP(key,rp){
  const f=S.factions[key];f.rp+=rp;
  while(f.rp>=rpToReach(f.level+1)){f.rp-=rpToReach(f.level+1);f.level++;addLog(`Reputation with ${FAC[key].name} rose to Level ${f.level}.`)}
}

   ================================================================ */
const relicById=id=>S.storage.find(x=>x.id===id&&x.kind==="relic");
function socketCands(sock){return S.gems.filter(g=>!g.reserved&&g.state==="spell"&&g.spell.school===sock.school&&g.spell.level===sock.level)}
function socketGem(rid,i,gid){
  const r=relicById(rid);if(!r||r.stage!=="dormant"&&r.stage!=="active")return;
  const s=r.sockets[i];
  if(s.gem){const g=S.gems.find(x=>x.id===s.gem);if(g)delete g.reserved;s.gem=null}
  if(gid){const g=S.gems.find(x=>x.id===gid);if(g){g.reserved="relic:"+rid;s.gem=g.id}}
  const was=r.stage;r.stage=r.sockets.every(x=>x.gem)?"active":"dormant";

function relicPayout(r){
  const gv=r.sockets.reduce((a,s)=>{const g=S.gems.find(x=>x.id===s.gem)||(r.frozen||{})[s.gem];return a+(g?gemValue(g.type,g.quality):0)},0);
  return {gems:gv,total:r2((r.base+gv)*CONDITIONS[r.condition].mod)};
}
function packRelic(rid){
  const r=relicById(rid);if(!r||r.stage!=="active"||!atHome())return;
  const c=RELIC_SIZES[r.size].crate;
  act(30,()=>{if(!pay(c,`Relic crate (${r.size})`))return false;
    r.frozen={};for(const s of r.sockets){const g=S.gems.find(x=>x.id===s.gem);r.frozen[s.gem]=deep(g);S.gems=S.gems.filter(x=>x.id!==s.gem)}
    r.stage="packed"},`Crated ${r.name} in straw and velvet, logo burned into the lid`);

function sendRelic(rid){
  const r=relicById(rid);if(!r||r.stage!=="packed")return;

function register(key){
  const f=S.factions[key];
  if(f.registered){f.autoRenew=!f.autoRenew;addLog(f.autoRenew?`Will keep paying ${FAC[key].name} dues.`:`Stopped paying ${FAC[key].name} dues — registration lapses at month's end.`);commit();return}
  if(!pay(cfg().registration,`${FAC[key].name} registration (${monthName(S.clock.day)})`))return;
  f.registered=true;f.autoRenew=true;addLog(`Registered with ${FAC[key].name}.`);commit();
}
function commissionChance(key){return 10+5*S.factions[key].level}
function perkCost(p,toRank){return 100*cfg().perks[p.id].t*toRank}
function buyPerk(id){
  const p=PERKS.find(x=>x.id===id),pc=cfg().perks[id],r=prank(id);
  if(S.stats[p.stat]<pc.t){toast("Not unlocked yet.");return}
  if(r>=pc.max){toast("Already at max rank.");return}
  const c=perkCost(p,r+1);
  if(!pay(c,`Perk — ${p.name} rank ${r+1}`))return;
  S.perks[id]=r+1;addLog(`Bought ${p.name} rank ${r+1}.`);
  if(id==="node_sense")fillNodes();
  commit();
}
function addStat(k){if(S.statPoints<1)return;S.statPoints--;S.stats[k]++;addLog(`+1 ${k[0].toUpperCase()+k.slice(1)}.`);commit()}
function buyLife(){
  if(S.lives>=livesCap()){toast("Already at the lives cap.");return}
  if(S.wallet+1e-9<cfg().lifeCost){toast(`Lives come out of Finn's own wallet — she has ${cr(S.wallet)}, needs ${cr(cfg().lifeCost)}.`);return}
  S.wallet=r2(S.wallet-cfg().lifeCost);walletLog(-cfg().lifeCost,"System Shop — Life & Care: 1 life");S.lives++;addLog("Bought a life from the System Shop.");commit();
}
function spendLife(){
  if(!confirm("Record a death? This spends one life and Finn respawns."))return;
  if(S.lives<1){toast("No lives left!");return}
  S.lives--;addLog("Finn died and respawned. One life spent.");commit();
}

function endDay(){
  if(!confirm(`End ${fmtDate(S.clock.day)}?`))return;
  const notes=overnight();
  addLog(`— ${fmtDate(S.clock.day)} begins. ${notes.join(" ")}`);
  toast(notes.length?notes.join(" "):"A quiet night.");
  commit();
  if(GH.ready()&&GH.mode()!=="manual")GH.pushSave();
}
function overnight(){
  const notes=[];
  if(!atHome()){S.location="home";S.pos=null;unload();notes.push("Finn sailed home and unloaded.")}
  const oldMonth=monthOf(S.clock.day);
  S.clock.day++;S.clock.min=420;
  // baths
  for(const o of S.orders)for(const s of o.slots)if(s.kind==="bath"&&s.bath==="soaking"){s.bath="soaked";notes.push(`Bath finished for ${s.req.spell.name}.`)}
  // expiries & deadlines
  const before=S.offers.length;S.offers=S.offers.filter(o=>o.expires>=S.clock.day);
  if(before-S.offers.length)notes.push(`${before-S.offers.length} offer(s) expired.`);
  for(const o of S.orders)if(o.urgent&&!o.missed&&S.clock.day>o.deadline){o.missed=true;notes.push(`Missed the deadline on ${o.title} — no urgency fee, no RP.`)}
  // new month
  const nm=monthOf(S.clock.day);
  if(nm!==oldMonth){
    notes.push(`${monthName(S.clock.day)} begins.`);
    notes.push(...closeMonth(monthName(S.clock.day-1)));
    if(S.lives<livesCap()){S.lives++;notes.push("Monthly life granted.")}else notes.push("Monthly life lost — already at the cap.");
    for(const f of FACTIONS){const st=S.factions[f.key];if(!st.registered)continue;
      if(st.autoRenew&&canPay(cfg().registration)){money(-cfg().registration,`${f.name} registration (${monthName(S.clock.day)})`)}
      else{st.registered=false;st.autoRenew=false;notes.push(`Registration with ${f.name} lapsed.`)}}
  }
  // commission rolls
  let got=0;
  for(const f of FACTIONS){const st=S.factions[f.key];if(!st.registered)continue;
    const ch=commissionChance(f.key);let n=Math.floor(ch/100);if(Math.random()*100<ch%100)n++;
    for(let i=0;i<n;i++){S.offers.push(genOrder(f));got++}}
  if(got)notes.push(`${got} new commission offer${got>1?"s":""} arrived.`);
  // nodes
  const had=S.nodes.length;fillNodes();if(S.nodes.length>had)notes.push(`${S.nodes.length-had} new Dredge Node${S.nodes.length-had>1?"s":""} glow on the water.`);
  return notes;
}
function jumpDate(iso,simulate){
  if(!iso){toast("Pick a date first.");return}
  const target=dnOf(iso),from=S.clock.day;
  if(target===from){toast("That's already today.");return}
  if(simulate){
    if(target<from){toast("Simulation only runs forward. Use Jump to go back.");return}
    const n=target-from;
    if(n>400){toast("That's over 400 days — jump without simulating, or pick a closer date.");return}
    if(!confirm(`Simulate ${n} night${n>1?"s":""}? Offers expire, dues get charged, commissions roll and nodes refresh for each day.`))return;
    let offers=0,lapsed=0;const before=S.offers.length;
    const counts={};
    for(let i=0;i<n;i++){const notes=overnight();for(const t of notes){if(t.includes("new commission"))offers+=parseInt(t)||0}}
    addLog(`— Simulated ${n} night${n>1?"s":""} from ${fmtDate(from)} to ${fmtDate(S.clock.day)}. ${offers} commission offer${offers===1?"":"s"} rolled along the way; ${S.offers.length} still open.`);
    toast(`Simulated to ${fmtDate(S.clock.day)}.`);
  }else{
    if(!confirm(`Jump to ${fmtDate(target)} without simulating? Nothing happens for the skipped days — no dues, lives, rolls or expiries.`))return;
    S.clock.day=target;S.clock.min=420;
    addLog(`— Date set to ${fmtDate(target)} (jumped ${target>from?"forward":"back"} ${Math.abs(target-from)} day${Math.abs(target-from)>1?"s":""}, no simulation).`);
  }
  commit();
  if(GH.ready()&&GH.mode()!=="manual")GH.pushSave();
}

/* ================================================================
   GITHUB DATA REPO
   ================================================================ */
function setFactions(j){DB.factions=j.factions||j;DB.planes=j.planes||[]}
const LS={save:"fff.save",gh:"fff.gh",db:"fff.db",dirty:"fff.dirty",synced:"fff.syncedAt",sha:"fff.saveSha"};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){console.warn(e)}}
let syncState="off",syncMsg="Not connected",pushTimer=null;
function saveLocal(dirty){lsSet(LS.save,S);if(dirty){lsSet(LS.dirty,true);if(GH.ready()){syncState="dirty";syncMsg="Unsynced changes";if(GH.mode()==="change"){clearTimeout(pushTimer);pushTimer=setTimeout(()=>GH.pushSave(),12000)}}}}
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const GH={
  cfg(){return lsGet(LS.gh,null)},
  ready(){const c=this.cfg();return !!(c&&c.owner&&c.repo&&c.token)},
  mode(){return (this.cfg()||{}).mode||"change"},
  url(path,withRef){const c=this.cfg();return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`+(withRef?`?ref=${encodeURIComponent(c.branch||"main")}`:"")},
  headers(){return {Authorization:"Bearer "+this.cfg().token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},
  async get(path){
    const r=await fetch(this.url(path,true),{headers:this.headers(),cache:"no-store"});
    if(r.status===404)return null;
    if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}: ${(await r.text()).slice(0,140)}`);
    const j=await r.json();
    let text;
    if(j.content&&j.encoding==="base64")text=b64dec(j.content);
    else{const r2=await fetch(this.url(path,true),{headers:{...this.headers(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});text=await r2.text()}
    return {data:JSON.parse(text),sha:j.sha};
  },
  async put(path,data,sha,message){
    const c=this.cfg();
    const body={message,content:b64enc(JSON.stringify(data,null,1)),branch:c.branch||"main"};if(sha)body.sha=sha;
    const r=await fetch(this.url(path,false),{method:"PUT",headers:{...this.headers(),"Content-Type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok){const e=new Error(`GitHub ${r.status} saving ${path}`);e.status=r.status;throw e}
    return (await r.json()).content.sha;
  },
  async loadDBs(){
    const [sp,rl,fc]=await Promise.all([this.get("spells.json"),this.get("relics.json"),this.get("factions.json")]);
    if(sp)DB.spells=sp.data.spells||sp.data;
    if(rl)DB.relics=rl.data.relics||rl.data;
    if(fc)setFactions(fc.data);
    relinkLifetime();
    lsSet(LS.db,DB);
    return {spells:!!sp,relics:!!rl,factions:!!fc};
  },
  async pullSave(force){
    const rem=await this.get("save.json");
    if(!rem){lsSet(LS.sha,null);return "none"}
    lsSet(LS.sha,rem.sha);
    const remoteAt=rem.data.meta?.savedAt||0,localAt=S?.meta?.savedAt||0,dirty=lsGet(LS.dirty,false);
    if(force||!S||(!dirty&&remoteAt>=localAt)){S=migrate(rem.data);saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    if(dirty&&remoteAt>(lsGet(LS.synced,0))){
      if(confirm("GitHub has a newer save than the last one this browser synced, and this browser also has unsynced changes.\n\nOK = load GitHub's save (this browser's changes are dropped)\nCancel = keep this browser's save (it will overwrite GitHub on next sync)")){S=migrate(rem.data);saveLocal(false);lsSet(LS.dirty,false);lsSet(LS.synced,remoteAt);return "loaded"}
    }
    return "kept";
  },
  async pushSave(){
    if(!this.ready())return;
    clearTimeout(pushTimer);
    if(this.busy){this.again=true;return}
    this.busy=true;
    try{await this._push()}finally{this.busy=false}
    if(this.again){this.again=false;return this.pushSave()}
  },
  async _push(){
    syncState="busy";syncMsg="Saving to GitHub…";renderStatus();
    try{
      let sha=lsGet(LS.sha,null);
      try{sha=await this.put("save.json",S,sha,`${isoOf(S.clock.day)} ${fmtTime(S.clock.min)}`)}
      catch(e){
        if(e.status===409||e.status===422){
          const rem=await this.get("save.json");
          const remoteAt=rem?.data?.meta?.savedAt||0;
          if(rem&&remoteAt>lsGet(LS.synced,0)&&!confirm("GitHub's save changed since this browser last synced (another device?). Overwrite it with this browser's save?"))throw new Error("Sync paused — resolve in Settings");
          sha=await this.put("save.json",S,rem?.sha,`${isoOf(S.clock.day)} ${fmtTime(S.clock.min)}`);
        }else throw e;
      }
      lsSet(LS.sha,sha);lsSet(LS.dirty,false);lsSet(LS.synced,S.meta.savedAt);
      syncState="ok";syncMsg="Saved to GitHub "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    }catch(e){syncState="err";syncMsg=e.message;console.error(e)}
    renderStatus();
  },
};

     <hr class="rule"><div class="row">${S.location===sel.id?`<span class="tag ok">You're here</span>`:`<button class="btn brass" data-act="sail" data-id="${sel.id}">Sail here (${cr(tripCost(sel))})</button>`}</div>`;
  }else side=`<h3>Dredge Nodes</h3><p class="muted small">Tap a glowing circle to see its fuel cost and any tags Finn can read. Every trip out costs Metered Mana; coming home is free.</p>`;
  return `${dbBanner()}<div class="grid g2">
   <div><div class="mapbox">${mapSVG()}</div></div>
   <div class="grid">
    <div class="panel">${side}</div>
    <div class="panel"><h3>${atHome()?"Docked at the lighthouse":here?"On station":"Open water"}</h3>
      <div class="row">
       <button class="btn" data-act="dredge" ${here&&here.left>0?"":"disabled"}>Dredge (20 min)</button>
       <button class="btn ghost" data-act="home" ${atHome()?"disabled":""}>Return home &amp; unload (30 min)</button>
      </div>
      ${here?`<p class="small muted">Hold: ${used(S.hold)}/${holdCap()} space. ${here.left} attempt${here.left===1?"":"s"} left before this node fades.</p>`:""}
    </div>
    <div class="panel"><h3><i>The Lucky Landshark</i> — hold <span class="meta">${used(S.hold)}/${holdCap()}</span></h3>
      <div class="bar brass"><i style="width:${Math.min(100,used(S.hold)/holdCap()*100)}%"></i></div>
      ${S.hold.length?`<div class="tscroll"><table><tr><th>Item</th><th>Space</th><th></th><th></th></tr>${S.hold.map(i=>itemRow(i,"hold")).join("")}</table></div>`:`<div class="empty">Empty hold.</div>`}
    </div>
   </div></div>`;
};

/* ---------- WORKROOM ---------- */
function gemRow(g){
  const res=g.reserved?`<span class="tag warn">${g.reserved.startsWith("relic:")?"in a relic":"on a work order"}</span>`:"";
  let cut;
  if(g.state==="rough")cut=`<span class="muted">Rough</span>`;
  else if(g.state==="plain")cut=`${esc(g.cut)} <span class="muted small">(plain)</span>`;
  else cut=spellTxt(g.spell);
  const val=gemValue(g.type,g.quality);
  return `<tr><td>${gemDot(g.type)} <b>${g.type}</b></td><td>${rarTag(GEMS[g.type].r)}</td><td>${qTag(g.quality)}</td><td>${cut}</td><td>${cr(val)}</td>
   <td>${res}${g.state==="rough"&&!g.reserved?`<button class="btn sm" data-act="cutopen" data-id="${g.id}">Cut…</button>`:""}</td></tr>`;
}
function cutPanel(){
  const g=S.gems.find(x=>x.id===UI.cutGem);if(!g||g.state!=="rough")return "";
  const schools=GEMS[g.type].s;
  const opts=DB.spells.filter(s=>schools.includes(s.school)).map(s=>{const ok=canCutSpell(s);return `<option value="${esc(s.name)}" ${ok?"":"disabled"}>${s.level===0?"Cantrip":"L"+s.level} · ${esc(s.name)} (${s.school}) — ${cr(spellCost(s.level))}, mana ${cr(spellCost(s.level)*.2)}${ok?"":" — locked"}</option>`}).join("");
  const wants=S.orders.flatMap(o=>o.slots.filter(s=>!slotPasses(s)&&roughFor(s).includes(g)).map(s=>`${o.title} (${s.label})`));
  return `<div class="panel" id="cutpanel"><h3>Cut ${gemDot(g.type)} ${g.quality} ${g.type} <span class="meta">${schools.map(s=>shapeSVG(s)+" "+s).join(" · ")}</span></h3>
   ${wants.length?`<p class="small">Could fill: ${wants.map(esc).join("; ")}</p>`:""}
   <div class="grid g2">
    <div><h4>Plain cut</h4><p class="small muted">1 hr · no mana · 2 XP</p>
      <div class="row"><select id="plainSel">${PLAIN_CUTS.map(c=>`<option>${c}</option>`).join("")}</select><button class="btn" data-act="cutplain" data-id="${g.id}">Cut</button></div></div>
    <div><h4>Spell cut</h4><p class="small muted">1 hr + 30 min per level · mana = 20% of spell price · 3 + level XP · max level now ${maxSpellLevel()}</p>
      ${opts?`<div class="row"><select id="spellSel" style="max-width:100%">${opts}</select><button class="btn brass" data-act="cutspell" data-id="${g.id}">Cut</button></div>`:`<p class="empty">Load the spell database first.</p>`}</div>
   </div><div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="cutclose">Close</button></div></div>`;
}
VIEWS.work=()=>{
  const geodes=S.storage.filter(i=>i.kind==="geode"),relics=S.storage.filter(i=>i.kind==="relic");
  const f=UI.vault,gems=S.gems.filter(g=>f==="all"||g.state===f).sort((a,b)=>a.state.localeCompare(b.state)||RARITIES.indexOf(GEMS[b.type].r)-RARITIES.indexOf(GEMS[a.type].r)||a.type.localeCompare(b.type)||qRank(b.quality)-qRank(a.quality));
  const cnt=k=>S.gems.filter(g=>k==="all"||g.state===k).length;
  return `${dbBanner()}${atHome()?"":`<div class="banner">Finn is out on the water. The workroom tools are back at the lighthouse.</div>`}
  ${cutPanel()}
  <div class="grid g2" style="margin-top:14px">
   <div class="panel"><h3>Gem Vault <span class="meta">${S.gems.length} stones</span></h3>
     <div class="row" style="margin-bottom:6px">${[["all","All"],["rough","Rough"],["plain","Plain cut"],["spell","Spell cut"]].map(([k,l])=>`<button class="btn sm ${f===k?"":"ghost"}" data-vault="${k}">${l} (${cnt(k)})</button>`).join("")}</div>
     ${gems.length?`<div class="tscroll"><table><tr><th>Gem</th><th>Rarity</th><th>Quality</th><th>Cut</th><th>Value</th><th></th></tr>${gems.map(gemRow).join("")}</table></div>`:`<div class="empty">No stones here yet. Chisel a geode.</div>`}
   </div>
   <div class="grid">
    <div class="panel"><h3>Storage Room <span class="meta">${used(S.storage)}/${storageCap()}</span></h3>
      <div class="bar"><i style="width:${Math.min(100,used(S.storage)/storageCap()*100)}%"></i></div>
      ${geodes.length+relics.length?`<div class="tscroll"><table><tr><th>Item</th><th>Space</th><th></th><th></th></tr>${[...geodes,...relics].map(i=>itemRow(i,"storage")).join("")}</table></div>`:`<div class="empty">Nothing waiting. Go dredge!</div>`}
    </div>
    <div class="panel"><h3>Parts drawer <span class="meta">${S.parts.length}</span></h3>${partsList()}</div>
   </div>
  </div>`;
};
function partsList(){
  if(!S.parts.length)return `<div class="empty">No Hallmark parcels on hand.</div>`;
  return `<table>${S.parts.map(p=>`<tr><td>${p.kind==="mounting"?`${p.metal} ${BASES[p.base].styles[p.slots]} <span class="muted small">${BASE_LABEL[p.base]}</span>`:esc(p.name)}</td><td>${cr(p.price)}</td><td>${p.reserved?`<span class="tag warn">on a work order</span>`:""}</td></tr>`).join("")}</table>`;
}

/* ---------- WORK ORDERS ---------- */
function reqText(s){
  const r=s.req;
  if(s.kind==="gem"){
    const g=`${gemDot(r.gemType)} <b>${r.gemType}</b>, ${r.minQ}${r.minQ==="Perfect"?"":" or better"}`;
    if(r.cut==="rough")return `${g} — <i>uncut rough</i>`;
    if(r.spell)return `${g}<br>${spellTxt(r.spell)}`;
    return `${g} — ${esc(r.cut)} cut`;
  }
  if(s.kind==="replace")return `Any gem cut for ${spellTxt(r.spell)}`;
  if(s.kind==="mounting")return `<b>${mountName(r.base,r.slots,r.metal)}</b> <span class="muted small">(${cr(mountingPrice(r.base,r.slots,r.metal))})</span>`;
  if(s.kind==="ornament")return `<b>${r.name}</b> <span class="muted small">(${cr(ORNAMENTS[r.name])})</span>`;
  if(s.kind==="accent")return `<b>${r.count} accent stones</b> — any plain-cut gems <span class="muted small">(${cr(r.count*ACCENT_PRICE)} to set)</span>`;
  if(s.kind==="bath")return `Re-attune ${spellTxt(r.spell)}`;
  return "";
}
function itemName(it){if(!it)return "";if(it.kind==="mounting")return mountName(it.base,it.slots,it.metal);if(it.kind==="ornament")return it.name;
  return `${it.quality} ${it.type}${it.state==="spell"?" · "+it.spell.name:it.state==="plain"?" · "+it.cut:" · rough"}`}
function slotHTML(o,s,i,offer){
  const pass=!offer&&slotPasses(s);
  let body="";
  if(!offer&&o.stage==="filling"){
    if(s.kind==="bath"){
      body=s.bath==="waiting"?`<button class="btn sm brass" data-act="bath" data-o="${o.id}" data-i="${i}">Unset &amp; bathe (30 min, mana ${cr(spellCost(s.req.spell.level)/2*.2)})</button>`
        :s.bath==="soaking"?`<span class="tag warn">Soaking — fresh crystal blooms overnight</span>`
        :s.bath==="soaked"?`<button class="btn sm" data-act="refacet" data-o="${o.id}" data-i="${i}">Re-facet (${fmtDur(60+30*s.req.spell.level)})</button>`
        :`<span class="tag ok">Re-faceted ✓</span>`;
    }else if(s.kind==="accent"){
      const have=fillOf(s),c=candidates(o,s),rc=roughFor(s);
      body=`${have.map(g=>`<span class="tag">${itemName(g)} <a href="#" data-act="unaccent" data-o="${o.id}" data-i="${i}" data-g="${g.id}" aria-label="remove">×</a></span>`).join(" ")}
       ${have.length<s.req.count?`<div class="row" style="margin-top:4px">${c.length?`<select data-fill="${o.id}" data-i="${i}"><option value="">Add a plain-cut stone…</option>${c.map(g=>`<option value="${g.id}">${esc(itemName(g))}</option>`).join("")}</select>`:""}
       ${rc.length?`<button class="btn sm ghost" data-act="cutfor" data-o="${o.id}" data-i="${i}">Cut one from rough (1 hr)</button>`:""}</div>`:""}`;
    }else{
      const c=candidates(o,s),cur=fillOf(s);
      const opts=(cur?[cur]:[]).concat(c);
      body=`<div class="row"><select data-fill="${o.id}" data-i="${i}"><option value="">${opts.length?"— choose from inventory —":"nothing in inventory matches"}</option>${opts.map(it=>`<option value="${it.id}" ${cur&&cur.id===it.id?"selected":""}>${esc(itemName(it))}</option>`).join("")}</select>`;
      if(!cur){
        const rc=roughFor(s);
        if(rc.length){const sp=s.req.spell;const t=sp?60+30*sp.level:60;const locked=sp&&!canCutSpell(sp);
          body+=`<button class="btn sm ghost" data-act="cutfor" data-o="${o.id}" data-i="${i}" ${locked?"disabled title='Spell level or pattern not unlocked yet'":""}>Cut from rough (${fmtDur(t)}${sp?`, mana ${cr(spellCost(sp.level)*.2)}`:""})</button>`}
        else if(s.kind==="gem"||s.kind==="replace")body+=`<span class="muted tiny">No qualifying rough — keep dredging.</span>`;
      }
      body+=`</div>`;
    }
  }
  if(!offer&&o.stage!=="filling"&&o.frozen){const f=o.frozen[i];if(f)body=Array.isArray(f)?"":`<span class="small">${esc(itemName(f))}</span>`}
  return `<div class="slot ${pass?"pass":""}"><div class="row between"><span class="lbl">${esc(s.label)}</span>${offer?"":pass?`<span class="tag ok">pass</span>`:`<span class="tag no">open</span>`}</div>
   <div class="req">${reqText(s)}</div>${body?`<div style="margin-top:5px">${body}</div>`:""}</div>`;
}
function orderCard(o,offer){
  const f=FAC[o.faction],p=priceOf(o,!offer),stages=["filling","assembled","packed"];
  const si=stages.indexOf(o.stage);
  const urgent=o.urgent?`<span class="tag urgent">Urgent +${cfg().urgentPct}%${offer?` · ${o.urgentDays}-day deadline`:o.missed?" — missed":` · due ${fmtShort(o.deadline)}`}</span>`:"";
  let foot="";
  if(offer){
    foot=`<div class="row between"><div><div class="muted tiny">Quoted</div><div class="price">${cr(o.quote)}</div><div class="muted tiny">Offer expires end of ${fmtShort(o.expires)} · ${rpOf(o)} RP</div></div>
     <div class="row"><button class="btn" data-act="accept" data-o="${o.id}" ${S.orders.length>=commissionCap()?"disabled title='Commission cap reached'":""}>Accept</button><button class="btn ghost" data-act="decline" data-o="${o.id}">Pass</button></div></div>`;
  }else{
    const all=o.slots.every(slotPasses),needParts=o.slots.some(s=>(s.kind==="mounting"||s.kind==="ornament")&&!s.fill);
    let btns="";
    if(o.stage==="filling"){
      btns=`<button class="btn sm ghost" data-act="autofill" data-o="${o.id}">Auto-fill</button>${needParts?`<button class="btn sm ghost" data-act="buyparts" data-o="${o.id}">Order parts</button>`:""}
       <button class="btn brass" data-act="assemble" data-o="${o.id}" ${all&&atHome()?"":"disabled"}>${o.type==="piece"?`Assemble (${fmtDur(60+15*o.slots.filter(s=>s.kind==="gem").length)})`:o.type==="reattune"?"Reset gem (15 min)":"Ready to pack"}</button>`;
    }else if(o.stage==="assembled")btns=`<button class="btn brass" data-act="pack" data-o="${o.id}" ${atHome()?"":"disabled"}>Pack (15 min, ${cr(PACK_COST)})</button>`;
    else if(o.stage==="packed")btns=`<button class="btn end" data-act="send" data-o="${o.id}" ${atHome()?"":"disabled"}>Send parcel (5 min)</button>`;
    foot=`<div class="stages">${stages.map((s,i)=>`<span class="${i<=si?"on":""}"></span>`).join("")}</div>
     <div class="row between"><div><div class="muted tiny">Live price · quoted ${cr(o.quote)}</div><div class="price">${cr(p.total)}</div>
      <div class="muted tiny">You keep ${cr(p.net)} after the ${cfg().referral}% referral · ${rpOf(o)} RP · ${5*rpOf(o)} XP</div></div>
      <div class="row">${btns}</div></div>
     <details class="small" style="margin-top:6px"><summary>Price breakdown</summary><table>${p.lines.map(([l,v])=>`<tr><td>${esc(l)}</td><td>${cr(v)}</td></tr>`).join("")}
      ${p.parts?`<tr><td>Lapidary Commission &amp; Sourcing Fee (${cfg().fee}% of parts)</td><td>${cr(p.fee)}</td></tr>`:""}
      ${p.urgentFee?`<tr><td>Urgent</td><td>${cr(p.urgentFee)}</td></tr>`:""}
      <tr><td><b>Total</b></td><td><b>${cr(p.total)}</b></td></tr><tr><td>Referral to faction</td><td>−${cr(p.referral)}</td></tr></table></details>
     ${o.stage==="filling"?`<div style="margin-top:6px"><a href="#" class="small muted" data-act="abandon" data-o="${o.id}">Cancel commission</a></div>`:""}`;
  }
  return `<article class="wo"><div class="wo-h"><div class="fac">${esc(f.name)}</div><h4>${esc(o.title)}</h4>
    <div class="small muted">on behalf of <b>${esc(o.who)}</b>${o.planes&&o.planes.length?` · ${esc(o.planes.join(", "))}`:""}</div>${urgent?`<div class="row" style="margin-top:3px">${urgent}</div>`:""}</div>
    <div class="wo-b">${o.type==="reattune"?`<p class="small muted">Customer's ${esc(o.reattune.piece.toLowerCase())}${o.reattune.cracked?" — the gem is cracked and needs replacing.":" — faded, needs a Manasonic Bath."}</p>`:""}
    ${o.slots.map((s,i)=>slotHTML(o,s,i,offer)).join("")}</div><div class="wo-f">${foot}</div></article>`;
}
VIEWS.orders=()=>`${dbBanner()}
  <div class="row between" style="margin-bottom:10px"><h2>Active work orders <span class="muted small">${S.orders.length}/${commissionCap()}</span></h2></div>
  ${S.orders.length?`<div class="cards">${S.orders.map(o=>orderCard(o,false)).join("")}</div>`:`<div class="panel empty">No active commissions. Accept an offer below.</div>`}
  <h2 style="margin:22px 0 10px">Offers <span class="muted small">${S.offers.length}</span></h2>
  ${S.offers.length?`<div class="cards">${S.offers.map(o=>orderCard(o,true)).join("")}</div>`:`<div class="panel empty">No offers waiting. Registered factions roll for commissions each time you End Day.</div>`}
  ${S.done.length?`<h2 style="margin:22px 0 10px">Delivered</h2><div class="panel tscroll"><table><tr><th>Date</th><th>Commission</th><th>Faction</th><th>Total</th><th>Kept</th><th>RP</th></tr>
   ${S.done.slice(0,40).map(d=>`<tr><td>${fmtShort(d.day)}</td><td>${esc(d.title)} ${d.urgent?`<span class="tag ${d.missed?"no":"urgent"}">${d.missed?"late":"urgent"}</span>`:""}</td><td class="small">${esc(FAC[d.faction].name)}</td><td>${cr(d.total)}</td><td>${cr(d.net)}</td><td>${d.rp}</td></tr>`).join("")}</table></div>`:""}`;

/* ---------- RELICS ---------- */
VIEWS.relics=()=>{
  const rs=S.storage.filter(i=>i.kind==="relic"),inHold=S.hold.filter(i=>i.kind==="relic").length;
  const cards=rs.map(r=>{
    const p=relicPayout(r);
    const socks=r.sockets.map((s,i)=>{
      const g=S.gems.find(x=>x.id===s.gem)||(r.frozen||{})[s.gem];
      const c=socketCands(s);
      return `<div class="sock ${g?"filled":""}"><div class="row">${shapeSVG(s.school)}<b>${s.level===0?"Cantrip":ordinal(s.level)}</b> ${s.school}</div>
        <div class="tiny muted">${SCHOOL_SHAPE[s.school]} socket${s.level?`, ${facets(s.level)} facets deep`:", smooth dome"}</div>
        ${r.stage==="packed"?`<div class="small">${g?esc(itemName(g)):""}</div>`:`<select data-sock="${r.id}" data-i="${i}" style="margin-top:4px;width:100%"><option value="">${g||c.length?"— empty —":"no matching cut gem"}</option>${g?`<option value="${g.id}" selected>${esc(itemName(g))}</option>`:""}${c.map(x=>`<option value="${x.id}">${esc(itemName(x))}</option>`).join("")}</select>`}</div>`}).join("");
    return `<div class="panel"><h3>${esc(r.name)} <span class="meta">${r.size} · ${r.condition} ×${CONDITIONS[r.condition].mod}</span></h3>
      <p class="small muted">${esc(r.description||"")}</p>
      <div class="sockets">${socks}</div>
      <div class="row between"><div><div class="muted tiny">Survey payout = (${cr(r.base)} base + ${cr(p.gems)} gems) × ${CONDITIONS[r.condition].mod}</div><div class="price">${cr(p.total)}</div><div class="muted tiny">${10*r.sockets.length} XP on sale</div></div>
      <div class="row">${r.stage==="dormant"?`<span class="tag">Dormant — ${r.sockets.filter(s=>!s.gem).length} socket(s) empty</span>`:r.stage==="active"?`<span class="tag ok">Active</span><button class="btn brass" data-act="packrelic" data-id="${r.id}" ${atHome()?"":"disabled"}>Crate it (30 min, ${cr(RELIC_SIZES[r.size].crate)})</button>`:`<button class="btn end" data-act="sendrelic" data-id="${r.id}">Send to the Survey (5 min)</button>`}</div></div></div>`;
  }).join("");
  return `${dbBanner()}${inHold?`<div class="banner">${inHold} relic(s) still in the trawler hold — bring them home to work on them.</div>`:""}
   <p class="muted small">Each socket's shape names a school; its depth names the spell level. Fill every socket with a matching spell-cut gem and the relic wakes up. The Survey pays for its base value plus the gems (base × Quality), times its condition.</p>
   ${rs.length?`<div class="grid">${cards}</div>`:`<div class="panel empty">No relics in storage. Wreck and Ruins nodes turn them up more often.</div>`}

};

/* ---------- HALLMARK ---------- */

const RELIC_RANGES={Small:[100,200,2,3],Medium:[250,400,3,5],Large:[500,800,5,7],Monumental:[1000,1500,7,10]};
function dbProblems(){
  const out=[];const have=new Set(DB.spells.map(s=>s.school+"|"+s.level));
  const names=new Set();
  DB.spells.forEach((s,i)=>{const w=`Spell #${i+1} (${s.name||"no name"})`;
    if(!s.name)out.push([w,"has no name"]);else if(names.has(s.name))out.push([w,"is listed twice"]);names.add(s.name);
    if(!SCHOOLS.includes(s.school))out.push([w,`has an unknown school "${s.school}"`]);
    if(!Number.isInteger(s.level)||s.level<0||s.level>9)out.push([w,`has level ${s.level} — use 0 (cantrip) to 9`])});
  const ids=new Set();
  DB.relics.forEach((r,i)=>{const w=`Relic ${r.id||"#"+(i+1)} (${r.name||"no name"})`,rg=RELIC_RANGES[r.size];
    if(!r.id)out.push([w,"has no id"]);else if(ids.has(r.id))out.push([w,"shares its id with another relic"]);ids.add(r.id);
    if(!r.name)out.push([w,"has no name"]);
    if(!rg){out.push([w,`has an unknown size "${r.size}" — use Small, Medium, Large or Monumental`]);return}
    if(!(r.base>=rg[0]&&r.base<=rg[1]))out.push([w,`base ${r.base} is outside ${r.size}'s ${rg[0]}–${rg[1]} Cr`]);
    const n=(r.sockets||[]).length;if(n<rg[2]||n>rg[3])out.push([w,`has ${n} sockets — ${r.size} relics take ${rg[2]}–${rg[3]}`]);
    (r.sockets||[]).forEach((k,j)=>{
      if(!SCHOOLS.includes(k.school))out.push([w,`socket ${j+1} has an unknown school "${k.school}"`]);
      else if(!Number.isInteger(k.level)||k.level<0||k.level>9)out.push([w,`socket ${j+1} has level ${k.level}`]);
      else if(!have.has(k.school+"|"+k.level))out.push([w,`socket ${j+1} needs a ${k.level?ordinal(k.level)+"-level":"cantrip"} ${k.school} spell, but the spell database has none — it can never be filled`])})});
  if(DB.factions){
    const planes=new Set(DB.planes||[]);
    for(const [k,f] of Object.entries(DB.factions)){
      if(!FAC[k]){out.push([`Faction "${k}"`,"isn't one of adv, arc, sch, col, peer, syn, tem, forge"]);continue}
      const oids=new Set();
      (f.organizations||[]).forEach(o=>{const w=`${FAC[k].name}: ${o.name||o.id}`;
        if(!o.id)out.push([w,"organization has no id"]);else if(oids.has(o.id))out.push([w,"shares its id with another organization"]);oids.add(o.id);
        if(!o.name)out.push([w,"organization has no name"]);
        if(planes.size)(o.planes||[]).forEach(pl=>{if(!planes.has(pl))out.push([w,`plane "${pl}" isn't in the planes list (typo?)`])})});
      (f.people||[]).forEach(p=>{const w=`${FAC[k].name}: ${p.name||"unnamed person"}`;
        if(!p.name)out.push([w,"person has no name"]);
        if(p.org&&!oids.has(p.org))out.push([w,`links to org "${p.org}", which isn't in this faction`]);
        if(planes.size)(p.planes||[]).forEach(pl=>{if(!planes.has(pl))out.push([w,`plane "${pl}" isn't in the planes list (typo?)`])})});
    }
  }
  return out;
}

  if(c==="clients"){
    if(!DB.factions)return `${tabs}<div class="panel empty">No factions.json loaded — commissions use the built-in client names. Add factions.json to your data repo.</div>`;
    return `${tabs}<div class="cards">${FACTIONS.map(f=>{const d=DB.factions[f.key]||{},orgs=d.organizations||[];
      return `<div class="panel"><h3>${esc(f.name)}</h3>
       <h4 style="margin-top:4px">Organizations</h4>${orgs.length?`<table>${orgs.map(o=>`<tr><td><b>${esc(o.name)}</b>${o.note?`<div class="tiny muted">${esc(o.note)}</div>`:""}</td><td class="small">${esc((o.planes||[]).join(", "))}</td></tr>`).join("")}</table>`:`<div class="empty">None yet.</div>`}

   ${probs.length?`<table>${probs.map(([w,m])=>`<tr><td><b>${esc(w)}</b></td><td>${esc(m)}</td></tr>`).join("")}</table>`:`<p><span class="tag ok">All clear</span> ${DB.spells.length} spells, ${DB.relics.length} relics${DB.factions?", factions file":""} look good.</p>`}</div>`;

/* ---------- SNAPSHOT ---------- */
function reqPlain(s){
  const r=s.req,sp=x=>`${x.name} (${x.level?ordinal(x.level)+"-level":"cantrip"} ${x.school}, ${SCHOOL_SHAPE[x.school]} cut${x.level?", "+facets(x.level)+" facets":""})`;
  if(s.kind==="gem"){const g=`${r.gemType}, ${r.minQ}${r.minQ==="Perfect"?"":" or better"}`;return r.cut==="rough"?`${g}, uncut rough`:r.spell?`${g}, cut for ${sp(r.spell)}`:`${g}, ${r.cut} cut`}
  if(s.kind==="replace")return `replacement gem cut for ${sp(r.spell)}`;
  if(s.kind==="mounting")return `${mountName(r.base,r.slots,r.metal)} mounting`;
  if(s.kind==="ornament")return r.name;
  if(s.kind==="accent")return `${r.count} accent stones`;
  if(s.kind==="bath")return `Manasonic Bath re-attunement of ${sp(r.spell)}`;
  return "";
}
function slotStatusPlain(s){
  if(s.kind==="bath")return {waiting:"not started",soaking:"soaking overnight",soaked:"soaked, ready to re-facet",done:"re-faceted"}[s.bath];
  if(s.kind==="accent")return `${(s.fill||[]).length}/${s.req.count} set aside`;
  const f=fillOf(s);return f?`filled: ${itemName(f)}`:"open";
}
function snapshotMD(){

  P(`Business account: ${cr(S.credits)} · Finn's wallet: ${cr(S.wallet)} · Lives: ${S.lives}/${livesCap()} · Hold ${used(S.hold)}/${holdCap()} · Storage ${used(S.storage)}/${storageCap()}`);
  P("");P(`## Finn`);
  P(`Level ${S.level} (${S.xp}/${xpToReach(S.level+1)} XP) · Combined Level ${combined}${S.statPoints?` · ${S.statPoints} unspent stat point${S.statPoints>1?"s":""}`:""}`);
  P(`- Insight ${st.insight} (${growthTier(st.insight)})`);P(`- Precision ${st.precision} (${growthTier(st.precision)})`);P(`- Renown ${st.renown} (${growthTier(st.renown)})`);
  const perks=PERKS.filter(p=>prank(p.id)).map(p=>`${p.name} ${prank(p.id)}/${cfg().perks[p.id].max}`);
  P(`- Perks: ${perks.length?perks.join(", "):"none yet"}`);
  const unl=SCHOOLS.filter(x=>!S.patterns[x]);
  P(`- Can spell-cut up to ${ordinal(maxSpellLevel())} level${unl.length?`; patterns not learned: ${unl.join(", ")}`:"; all eight school patterns learned"}`);
  {const p=P_();P("");P(`## Partnership with Emma Frost`);
   if(p.active){P(`Emma is a silent partner (883,000 Cr invested, ${p.share}% of distributable profit monthly). Distributed so far: ${cr(p.paid)} of the ${cr(p.cap)} cap (${(p.paid/p.cap*100).toFixed(1)}%); buyout today would cost ${cr(owedLeft())}. Owner's draw: ${cr(p.draw)}/month.`);
     P(`This month so far: ${cr(p.cur.income)} income, ${cr(p.cur.costs)} business costs.`);
     if(p.history[0])P(`Last month (${p.history[0].month}): ${cr(p.history[0].profit)} distributable profit, ${cr(p.history[0].emma)} to Emma.`)}
   else P(p.endedHow==="buyout"?"Finn bought Emma out — she owns the business outright.":"Emma's distributions reached the cap — Finn owns the business outright.");}
  P("");P(`## Factions`);
  const reg=FACTIONS.filter(f=>S.factions[f.key].registered),rest=FACTIONS.filter(f=>!S.factions[f.key].registered&&(S.factions[f.key].level||S.factions[f.key].rp));

  for(const f of [...reg,...rest]){const x=S.factions[f.key];P(`- ${f.name}: Reputation Level ${x.level} (${x.rp}/${rpToReach(x.level+1)} RP), ${x.registered?(x.autoRenew?"registered":"registered, lapsing at month's end"):"not registered"}`)}

    for(const s of o.slots)P(`- ${s.label}: ${reqPlain(s)} — ${o.stage==="filling"?slotStatusPlain(s):"done"}`);
    P(`- Stage: ${{filling:"gathering parts",assembled:"assembled, needs packing",packed:"packed, ready to send"}[o.stage]} · live price ${cr(pr.total)}`);
  }
  if(S.offers.length){P("");P(`## Offers waiting (${S.offers.length})`);
    for(const o of S.offers)P(`- ${o.title} — ${FAC[o.faction].name} on behalf of ${o.who}${o.planes&&o.planes.length?` (${o.planes.join(", ")})`:""}, quoted ${cr(o.quote)}${o.urgent?", urgent":""}, expires ${fmtShort(o.expires)}`)}
  const relics=[...S.storage,...S.hold].filter(i=>i.kind==="relic");
  if(relics.length){P("");P(`## Relics on hand`);
    for(const r of relics){const filled=r.sockets.filter(k=>k.gem).length;

  const geo=s=>{const c={};s.filter(i=>i.kind==="geode").forEach(i=>c[i.size]=(c[i.size]||0)+1);return Object.keys(GEODES).filter(k=>c[k]).map(k=>`${c[k]} ${k}`).join(", ")};
  P("");P(`## Stone`);
  P(`- *The Lucky Landshark*'s hold: ${geo(S.hold)||"no geodes"}`);P(`- Storage Room: ${geo(S.storage)||"no geodes"}`);
  const by=k=>S.gems.filter(g=>g.state===k);
  P(`- Gem Vault: ${S.gems.length} stones — ${by("rough").length} rough, ${by("plain").length} plain-cut, ${by("spell").length} spell-cut`);
  const notable=S.gems.filter(g=>g.state==="spell"||g.quality==="Perfect"||["Rare","Mythic Rare"].includes(GEMS[g.type].r));

  if(S.parts.length)P(`- Hallmark parts on hand: ${S.parts.map(p=>p.kind==="mounting"?`${p.metal} ${BASES[p.base].styles[p.slots]} ${BASE_LABEL[p.base].toLowerCase()}`:p.name).join("; ")}`);
  P("");P(`## Dredge Nodes`);

  const found=Object.keys(S.lifetime.found).length;

  P(`- Commissions delivered: ${S.done.length}${S.done.length?`, most recent: ${S.done.slice(0,3).map(d=>`${d.title} for ${d.who} (${fmtShort(d.day)})`).join("; ")}`:""}`);
  P(`- Relics found: ${found} of ${DB.relics.length} kinds; sold to the Survey: ${S.relics.length}`);
  P("");P(`## Recent journal`);
  for(const l of S.log.slice(0,10))P(`- ${l.at} — ${l.text}`);
  return L.join("\n");
}
