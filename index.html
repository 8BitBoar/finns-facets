function partnerView(){
  const p=P_(),m=p.cur,proj=r2(m.income-m.costs-p.draw),projE=p.active&&proj>0?r2(Math.min(proj*p.share/100,owedLeft())):0;
  const pct=Math.min(100,p.paid/p.cap*100);
  const done=!p.active;
  return `<div class="grid g2"><div class="grid">
   <div class="panel"><h3>Emma Frost — silent partner <span class="meta">${done?"partnership ended":"active"}</span></h3>
    ${done?`<div class="banner" style="background:#d6ecdc;color:#1f6138;border-color:#9fcfae">${p.endedHow==="buyout"?"Finn bought Emma out.":"Emma's distributions reached the cap."} Finn owns the lighthouse, <i>The Lucky Landshark</i> and the business outright.</div>`:""}
    <div class="row between"><span>Toward Finn owning it all</span><span class="small muted">${cr(p.paid)} / ${cr(p.cap)}</span></div>
    <div class="bar brass" style="height:14px;margin:6px 0"><i style="width:${pct}%"></i></div>
    <div class="small muted">${pct.toFixed(2)}% · ${done?"":`buyout today: <b>${cr(owedLeft())}</b>`}</div>
    ${done?"":`<div class="row" style="margin-top:10px"><button class="btn brass" data-act="buyout" ${canPay(owedLeft())?"":"disabled"}>Buy Emma out — ${cr(owedLeft())}</button><span class="tiny muted">from the business account</span></div>`}
    <hr class="rule"><dl class="kv"><dt>Invested</dt><dd>${cr(p.invested)} — lighthouse, cottage, dock, workshop, <i>The Lucky Landshark</i>, 1,000 Cr starting liquidity</dd>
     <dt>Profit share</dt><dd>${p.share}% of distributable profit, paid on the 1st</dd><dt>Buyout / cap</dt><dd>${cr(p.cap)} (120% of the investment), less distributions paid</dd>
     <dt>Owner's draw</dt><dd>${cr(p.draw)}/month <a href="#" class="small" data-act="setdraw">change</a></dd></dl></div>
   </div><div class="grid">
   <div class="panel"><h3>This month <span class="meta">${monthName(S.clock.day)}, so far</span></h3>
    <table><tr><td>Income (commissions, Survey)</td><td class="cr-plus">${cr(m.income)}</td></tr>
     <tr><td>Business costs (dues, trips, mana, parts, packing, referrals, perks)</td><td class="cr-minus">−${cr(m.costs)}</td></tr>
     <tr><td>Owner's draw</td><td class="cr-minus">−${cr(p.draw)}</td></tr>
     <tr><td><b>Distributable profit</b></td><td><b>${cr(proj)}</b></td></tr>
     <tr><td>Emma's ${p.share}% ${proj>0?"":"<span class='tiny muted'>(loss month — nothing owed)</span>"}</td><td>${cr(projE)}</td></tr></table>
    <p class="tiny muted">Closes on the 1st: the draw moves to Finn's wallet, and Emma's share is paid from the business account.</p></div>
   <div class="panel"><h3>Monthly distributions</h3>${p.history.length?`<div class="tscroll"><table><tr><th>Month</th><th>Income</th><th>Costs</th><th>Draw</th><th>Profit</th><th>Emma</th></tr>
    ${p.history.map(h=>`<tr><td>${esc(h.month)}</td><td>${cr(h.income)}</td><td>${cr(h.costs)}</td><td>${cr(h.draw)}</td><td>${cr(h.profit)}</td><td><b>${cr(h.emma)}</b></td></tr>`).join("")}</table></div>`:`<div class="empty">No months closed yet.</div>`}</div>
  </div></div>`;
}

VIEWS.ledger=()=>{
  const t=UI.ledgerTab;
  const tb=`<div class="row" style="margin-bottom:10px">${[["partner","Partnership"],["money","Business"],["wallet","Finn's wallet"],["events","Journal"]].map(([k,l])=>`<button class="btn sm ${t===k?"":"ghost"}" data-ltab="${k}">${l}</button>`).join("")}</div>`;
  if(t==="partner")return tb+partnerView();
  if(t==="wallet")return tb+`<div class="panel"><h3>Finn's wallet <span class="meta">${cr(S.wallet)}</span></h3>
    <p class="small muted">Her own money: the owner's draw lands here on the 1st. Lives from Life &amp; Care come out of here.</p>
    <div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="wspend">Record personal spending</button><button class="btn sm ghost" data-act="wtobiz">Put money into the business</button></div>
    <div class="log">${(S.wledger||[]).map(l=>`<div class="row between"><span><span class="t">${l.at}</span>${esc(l.text)}</span><span><span class="${l.amt>=0?"cr-plus":"cr-minus"}">${l.amt>=0?"+":""}${cr(l.amt)}</span> <span class="muted tiny">${cr(l.bal)}</span></span></div>`).join("")||`<div class="empty">Nothing yet — the first draw arrives on the 1st.</div>`}</div></div>`;
  return tb+`<div class="panel log">${t==="events"?(S.log.map(l=>`<div><span class="t">${l.at}</span>${esc(l.text)}</div>`).join("")||`<div class="empty">Nothing yet.</div>`)
   :(S.ledger.map(l=>`<div class="row between"><span><span class="t">${l.at}</span>${esc(l.text)}</span><span><span class="${l.amt>=0?"cr-plus":"cr-minus"}">${l.amt>=0?"+":""}${cr(l.amt)}</span> <span class="muted tiny">${cr(l.bal)}</span></span></div>`).join("")||`<div class="empty">No transactions yet.</div>`)}</div>`;
};

/* ---------- SETTINGS ---------- */
VIEWS.settings=()=>{
  const c=GH.cfg()||{owner:"8BitBoar",repo:"finns-facets-data",branch:"main",token:"",mode:"change"};
  const C=cfg();
  const num=(k,label,step=1)=>`<label class="f">${label}<input type="number" step="${step}" data-cfg="${k}" value="${C[k]}"></label>`;
  return `<div class="grid g2"><div class="grid">
   <div class="panel"><h3>Calendar <span class="meta">${fmtDate(S.clock.day)}</span></h3>
    <p class="small muted">Only End Day moves the date on its own. Dues and the monthly life land on the 1st.</p>
    <div class="row" style="align-items:flex-end"><label class="f">Go to date<input type="date" id="jumpDate" value="${isoOf(S.clock.day)}"></label>
     <button class="btn ghost" data-act="jump">Jump</button><button class="btn" data-act="jumpsim">Jump &amp; simulate</button></div>
    <p class="tiny muted" style="margin-top:6px"><b>Jump</b> just changes the date, forward or back — nothing happens for the skipped days. <b>Jump &amp; simulate</b> (forward only) runs End Day for every night in between.</p></div>
   <div class="panel"><h3>GitHub data repo</h3>
    <p class="small muted">Your spells, relics and save live in a private repo. The token stays in this browser only. Use a fine-grained token limited to the data repo with <b>Contents: Read and write</b>.</p>
    <div class="row" style="align-items:flex-end">
     <label class="f">Owner<input type="text" id="ghOwner" value="${esc(c.owner)}"></label>
     <label class="f">Repo<input type="text" id="ghRepo" value="${esc(c.repo)}"></label>
     <label class="f">Branch<input type="text" id="ghBranch" value="${esc(c.branch||"main")}" style="width:90px"></label>
    </div>
    <div class="row" style="align-items:flex-end;margin-top:6px">
     <label class="f" style="flex:1">Token<input type="password" id="ghToken" value="${esc(c.token)}" autocomplete="off" placeholder="github_pat_…"></label>
     <label class="f">Auto-save<select id="ghMode"><option value="change" ${c.mode==="change"?"selected":""}>After changes</option><option value="endday" ${c.mode==="endday"?"selected":""}>After End Day</option><option value="manual" ${c.mode==="manual"?"selected":""}>Manual only</option></select></label>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn" data-act="ghconnect">Save &amp; connect</button><button class="btn ghost" data-act="ghpush" ${GH.ready()?"":"disabled"}>Save to GitHub now</button><button class="btn ghost" data-act="ghpull" ${GH.ready()?"":"disabled"}>Load save from GitHub</button><button class="btn ghost" data-act="ghforget">Forget token</button></div>
    <p class="small" style="margin-top:8px"><span class="dot ${({ok:"ok",dirty:"dirty",err:"err",off:"off",busy:"dirty"})[syncState]}"></span> ${esc(syncMsg)}</p>
    <p class="small muted">Databases loaded: ${DB.spells.length} spells, ${DB.relics.length} relics, ${DB.factions?Object.values(DB.factions).reduce((a,f)=>a+(f.organizations||[]).length+(f.people||[]).length,0)+" clients":"no factions file"}.</p>
   </div>
   <div class="panel"><h3>Files</h3>
    <div class="row"><button class="btn ghost" data-act="export">Download save.json</button><label class="btn ghost">Import save<input type="file" accept=".json" id="impSave" hidden></label></div>
    <p class="small muted" style="margin-top:8px">Offline? Load the databases from files instead:</p>
    <div class="row"><label class="btn ghost">Load spells.json<input type="file" accept=".json" id="impSpells" hidden></label><label class="btn ghost">Load relics.json<input type="file" accept=".json" id="impRelics" hidden></label><label class="btn ghost">Load factions.json<input type="file" accept=".json" id="impFactions" hidden></label></div>
    <hr class="rule"><div class="row"><button class="btn sm ghost" data-act="theme">Theme: ${document.documentElement.dataset.theme||"auto"}</button><button class="btn sm ghost" data-act="credits">Set business Credits…</button><button class="btn sm ghost" data-act="setwallet">Set wallet…</button><button class="btn sm danger" data-act="newgame">New game</button></div>
   </div></div>
   <div class="grid">
   <div class="panel"><h3>Rules &amp; placeholders</h3>
    <p class="small muted">Numbers from the docs are the defaults. Ones marked * are open threads in the docs, picked so the tool runs — change them freely.</p>
    <div class="row">${num("commissionCap","Commission cap")}${num("livesCap","Lives cap")}${num("lifeCost","Life cost")}${num("registration","Dues / month")}${num("referral","Referral %")}${num("fee","Sourcing fee %")}${num("urgentPct","Urgent %")}${num("urgentChance","Urgent chance %")}</div>
    <div class="row" style="margin-top:8px">${num("relicBase","Relic chance %*")}${num("relicWreck","+ Wreck %*")}${num("relicRuins","+ Ruins %*")}${num("condShift","Condition shift per Wreck/Ruins tag*")}${num("crackChance","Cracked gem %*")}${num("spellLevelBase","Base spell level*")}${num("precisionPerSpellLevel","Precision per spell level*")}</div>
    <hr class="rule"><h4>Perk thresholds &amp; max ranks*</h4>
    <table>${PERKS.map(p=>`<tr><td>${p.name}</td><td><label class="small">${p.stat} ≥ <input type="number" data-perk="${p.id}" data-f="t" value="${C.perks[p.id].t}" style="width:60px"></label></td><td><label class="small">max <input type="number" data-perk="${p.id}" data-f="max" value="${C.perks[p.id].max}" style="width:60px"></label></td></tr>`).join("")}</table>
    <hr class="rule"><h4>Gem base prices*</h4><p class="tiny muted">One number per gem, inside its rarity's range.</p>
    <div class="row">${Object.keys(GEMS).map(g=>`<label class="f">${gemDot(g)} ${g}<input type="number" data-gemprice="${g}" value="${C.gemPrices[g]}" style="width:75px"></label>`).join("")}</div>
   </div></div></div>`;
};

/* ================================================================
   EVENTS
   ================================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-vault],[data-ltab],[data-codex]");if(!t)return;
  if(t.dataset.tab){e.preventDefault();UI.tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.dataset.vault){UI.vault=t.dataset.vault;render();return}
  if(t.dataset.codex){UI.codex=t.dataset.codex;render();return}
  if(t.dataset.ltab){UI.ledgerTab=t.dataset.ltab;render();return}
  const a=t.dataset.act,id=t.dataset.id,o=t.dataset.o,i=+t.dataset.i;
  if(t.tagName==="A")e.preventDefault();
  switch(a){
   case"sail":sail(id);break; case"dredge":dredge();break; case"home":returnHome();break;
   case"toss":toss(t.dataset.where,id);break; case"chisel":chisel(id);break;
   case"cutopen":UI.cutGem=id;render();$("#cutpanel")?.scrollIntoView({behavior:"smooth",block:"start"});break;
   case"cutclose":UI.cutGem=null;render();break;
   case"cutplain":if(cutPlain(id,$("#plainSel").value)){UI.cutGem=null;render()}break;
   case"cutspell":if(cutSpell(id,$("#spellSel").value)){UI.cutGem=null;render()}break;
   case"accept":accept(o);break; case"decline":decline(o);break; case"abandon":abandon(o);break;
   case"autofill":autoFill(o);break; case"buyparts":buyPartsFor(o);break; case"cutfor":cutFor(o,i);break;
   case"unaccent":unfillAccent(o,i,t.dataset.g);break;
   case"bath":startBath(o,i);break; case"refacet":refacet(o,i);break;
   case"assemble":assemble(o);break; case"pack":packOrder(o);break; case"send":sendOrder(o);break;
   case"packrelic":packRelic(id);break; case"sendrelic":sendRelic(id);break;
   case"buymount":orderMounting(UI.hmBase||"Ring",Math.min(Math.max(UI.hmSlots||BASES[UI.hmBase||"Ring"].min,BASES[UI.hmBase||"Ring"].min),BASES[UI.hmBase||"Ring"].max),UI.hmMetal||"Silver");break;
   case"buyorn":orderOrnament(t.dataset.name);break;
   case"reg":register(t.dataset.k);break;
   case"stat":addStat(t.dataset.k);break; case"perk":buyPerk(id);break;
   case"buylife":buyLife();break; case"die":spendLife();break;
   case"ghconnect":ghConnect();break; case"ghpush":GH.pushSave();break;
   case"ghpull":GH.pullSave(true).then(r=>{toast(r==="none"?"No save.json in the repo yet.":"Loaded the save from GitHub.");render()}).catch(err=>toast(err.message));break;
   case"ghforget":{const c=GH.cfg();if(c){c.token="";lsSet(LS.gh,c)}syncState="off";syncMsg="Not connected";render();break}
   case"export":download("save.json",JSON.stringify(S,null,1));break;
   case"setwallet":{const v=prompt("Set Finn's personal wallet to:",S.wallet);if(v!=null&&!isNaN(+v)){walletLog(+v-S.wallet,"Manual adjustment");S.wallet=r2(+v);commit()}break}
   case"buyout":buyout();break; case"wspend":walletSpend();break; case"wtobiz":walletToBiz();break;
   case"setdraw":{const v=prompt("New monthly owner's draw (Finn and Emma agree):",P_().draw);if(v!=null&&+v>=0){addLog(`Owner's draw changed from ${cr(P_().draw)} to ${cr(+v)} a month.`);P_().draw=+v;commit()}break}
   case"jump":jumpDate($("#jumpDate").value,false);break;
   case"jumpsim":jumpDate($("#jumpDate").value,true);break;
   case"snapcopy":{const txt=snapshotMD();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Snapshot copied.")).catch(()=>{const ta=$("#snapText");ta.select();document.execCommand("copy");toast("Snapshot copied.")});break}
   case"snapdl":download(`finn-snapshot-${isoOf(S.clock.day)}.md`,snapshotMD(),"text/markdown");break;
   case"theme":{const r=document.documentElement,n={auto:"light",light:"dark",dark:"auto"}[r.dataset.theme||"auto"];if(n==="auto")delete r.dataset.theme;else r.dataset.theme=n;lsSet("fff.theme",n);render();break}
   case"credits":{const v=prompt("Set the business balance to:",S.credits);if(v!=null&&!isNaN(+v)){money(+v-S.credits,"Manual adjustment","none");commit()}break}
   case"newgame":if(confirm("Start a brand-new save? Your current one is replaced (download it first if you want a copy).")){newGame();lsSet(LS.dirty,true);commit()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.id==="cxQ"){UI.cxQ=e.target.value;clearTimeout(UI.qT);UI.qT=setTimeout(()=>{render();const el=$("#cxQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.fill){const o=t.dataset.fill,i=+t.dataset.i;fillSlot(o,i,t.value||null);return}
  if(t.dataset.sock){socketGem(t.dataset.sock,+t.dataset.i,t.value||null);return}
  if(t.dataset.pattern){S.patterns[t.dataset.pattern]=t.checked;commit();return}
  if(t.dataset.cfg){S.config[t.dataset.cfg]=+t.value;commit();return}
  if(t.dataset.perk){S.config.perks[t.dataset.perk][t.dataset.f]=+t.value;commit();return}
  if(t.dataset.gemprice){S.config.gemPrices[t.dataset.gemprice]=+t.value;commit();return}
  if(t.dataset.cx){UI[t.dataset.cx]=t.value;render();return}
  if(t.id==="hmBase"){UI.hmBase=t.value;UI.hmSlots=BASES[t.value].min;render();return}
  if(t.id==="hmSlots"){UI.hmSlots=+t.value;render();return}
  if(t.id==="hmMetal"){UI.hmMetal=t.value;render();return}
  if(t.id==="impSave"||t.id==="impSpells"||t.id==="impRelics"||t.id==="impFactions"){
    const file=t.files[0];if(!file)return;file.text().then(txt=>{
      try{const j=JSON.parse(txt);
        if(t.id==="impSave"){S=migrate(j);lsSet(LS.dirty,true);commit();toast("Save imported.")}
        else if(t.id==="impSpells"){DB.spells=j.spells||j;lsSet(LS.db,DB);toast(`${DB.spells.length} spells loaded.`);render()}
        else if(t.id==="impFactions"){setFactions(j);lsSet(LS.db,DB);toast("Factions loaded.");render()}
        else{DB.relics=j.relics||j;relinkLifetime();lsSet(LS.db,DB);toast(`${DB.relics.length} relics loaded.`);render()}
      }catch(err){toast("That file isn't valid JSON.")}});
  }
});
$("#endDayBtn").addEventListener("click",endDay);
$("#snapBtn").addEventListener("click",()=>{UI.tab="snapshot";render();window.scrollTo({top:0})});
function download(name,text,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function ghConnect(){
  const c={owner:$("#ghOwner").value.trim(),repo:$("#ghRepo").value.trim(),branch:$("#ghBranch").value.trim()||"main",token:$("#ghToken").value.trim(),mode:$("#ghMode").value};
  lsSet(LS.gh,c);
  if(!GH.ready()){toast("Fill in owner, repo and token.");return}
  syncState="busy";syncMsg="Connecting…";render();
  try{
    const got=await GH.loadDBs();
    const r=await GH.pullSave(false);
    if(r==="none"){await GH.pushSave()}
    else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=r==="loaded"?"Loaded save from GitHub":"Connected — this browser's save kept"}
    toast(`Connected. ${DB.spells.length} spells, ${DB.relics.length} relics${got.spells&&got.relics&&got.factions?"":" (a database file is missing from the repo)"}.`);
  }catch(err){syncState="err";syncMsg=err.message}
  render();
}

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  const th=lsGet("fff.theme","auto");if(th!=="auto")document.documentElement.dataset.theme=th;
  DB=lsGet(LS.db,{spells:[],relics:[]});
  const local=lsGet(LS.save,null);
  if(local)S=migrate(local);else newGame();
  relinkLifetime();
  render();
  if(GH.ready()){
    syncState="busy";syncMsg="Syncing…";renderStatus();
    try{await GH.loadDBs();const r=await GH.pullSave(false);if(r==="none")await GH.pushSave();
      else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=lsGet(LS.dirty,false)?"Unsynced changes":"In sync with GitHub"}}
    catch(e){syncState="err";syncMsg=e.message}
    render();
  }else{saveLocal(false)}
  addEventListener("beforeunload",e=>{if(GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()!=="manual"){GH.pushSave()}});
})();
</script>
